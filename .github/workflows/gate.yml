# #306 — the gate every pull request must pass, on BOTH database engines.
# SQLite is what the workstation and the suites default to; Postgres is what
# production and preprod actually run. Every divergence the audit found was
# invisible on SQLite alone.
name: gate

on:
  pull_request:
    branches: [preprod, main]
  push:
    branches: [preprod, main]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.backend }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
        # Three machines per backend, each running a balanced third of the suites
        # (run_gate_ci.py --shard); one leg alone took ~12 minutes.
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ssc_gate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SSC_TZ: America/New_York
      PYTHONDONTWRITEBYTECODE: "1"
      # test-only seams stay unset; nothing here talks to Anthropic / SendGrid / Google
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages (tzdata for SSC_TZ, fonts for the design guard's renders)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tzdata fonts-dejavu-core > /dev/null

      - name: Python dependencies
        run: pip install --quiet -r requirements.txt

      - name: Build the empty Postgres fixture (same path as preprod bring-up)
        if: matrix.backend == 'postgres'
        env:
          SSC_ENVIRONMENT: preprod
          SSC_PREPROD_FIXTURE_BOOTSTRAP_CONFIRM: CREATE_EMPTY_FIXTURE_SCHEMA
          SSC_DB_URL: postgresql://postgres:postgres@localhost:5432/ssc_gate
        run: python preprod_fixture_bootstrap.py

      - name: Gate
        env:
          SSC_DB_URL: ${{ matrix.backend == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/ssc_gate' || '' }}
        run: python tests/run_gate_ci.py --backend ${{ matrix.backend }} --shard ${{ matrix.shard }}/3
