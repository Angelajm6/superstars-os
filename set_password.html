<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/files/static/fonts/typography.css">
<title>Set your password · Superstars Contracting</title>
<style>
  :root{
    --brand-red:#B11E2E; --brand-red-deep:#8B1623; --ink:#14161C; --cream:#FAF7F1;
    --paper:#FFFFFF; --hairline:#E8E4DD; --mute:#76777E; --bad:#B11E2E; --good:#15803D;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--cream);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--hairline);border-radius:12px;box-shadow:0 4px 18px rgba(20,22,28,0.06);padding:32px 32px 28px;}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .brand-mark{width:40px;height:40px;flex-shrink:0;}
  .brand-name{font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;letter-spacing:0.5px;color:var(--ink);text-transform:uppercase;}
  .brand-sub{font-size:10px;color:var(--mute);letter-spacing:1.2px;text-transform:uppercase;font-weight:600;margin-top:2px;}
  h1{font-size:20px;font-weight:700;margin-bottom:4px;}
  .sub{font-size:13px;color:var(--mute);margin-bottom:18px;}
  label{display:block;font-size:11px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--mute);margin-bottom:6px;margin-top:14px;}
  input[type="password"]{width:100%;padding:10px 44px 10px 12px;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--hairline);border-radius:9px;outline:none;transition:border-color 0.15s ease;}
  input[type="password"]:focus{border-color:var(--brand-red);box-shadow:0 0 0 3px rgba(177,30,46,0.12);}
  .password-wrap{position:relative;}
  .password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;margin:0;padding:0;border:0;border-radius:7px;color:var(--mute);background:transparent;display:grid;place-items:center;}
  .password-toggle:hover,.password-toggle:focus-visible{background:#F7F4EE;color:var(--ink);outline:none;}
  .password-toggle svg{width:18px;height:18px;}
  .rules{font-size:12px;color:var(--mute);margin-top:10px;line-height:1.7;}
  .rules li{margin-left:16px;}
  .rules li.ok{color:var(--good);list-style:none;margin-left:0;}
  .rules li.ok::before{content:"\2713  ";font-weight:700;}
  .msg{border-radius:6px;padding:9px 12px;font-size:13px;margin-top:16px;display:none;}
  .msg.err{background:#FBEAEC;color:var(--bad);border:1px solid #F1C0C5;}
  .msg.ok{background:#E9F6EE;color:var(--good);border:1px solid #BFE6CC;}
  .msg.show{display:block;}
  button{width:100%;margin-top:20px;padding:11px 16px;font:inherit;font-size:14px;font-weight:700;letter-spacing:0.3px;color:white;background:var(--brand-red);border:none;border-radius:6px;cursor:pointer;transition:background 0.15s ease;}
  button:hover:not(:disabled){background:var(--brand-red-deep);}
  button:disabled{opacity:0.6;cursor:not-allowed;}
  .foot{margin-top:16px;font-size:11px;color:var(--mute);text-align:center;}
  .holding{text-align:center;color:var(--mute);font-size:14px;line-height:1.6;padding:8px 0;}
  .brand-mark,.mark{object-fit:contain;}  /* #265 swap-safe logo */
</style>
</head>
<body>
<div class="wrap">
  <form class="card" id="set-form" autocomplete="off" novalidate>
    <div class="brand">
      <img class="brand-mark" src="/files/static/brand/mark.svg" alt="Superstars Contracting">
      <div><div class="brand-name">Superstars Contracting</div><div class="brand-sub">Office Console</div></div>
    </div>

    <div id="form-body">
      <h1>Set your password</h1>
      <div class="sub" id="welcome">Choose a password to finish signing in. You'll use it from now on.</div>

      <label for="pw">New password</label>
      <div class="password-wrap"><input id="pw" type="password" autocomplete="new-password" required><button class="password-toggle" id="toggle-pw" type="button" aria-label="Show new password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.4 12s3.5-6 9.6-6 9.6 6 9.6 6-3.5 6-9.6 6-9.6-6-9.6-6Z"/><circle cx="12" cy="12" r="2.8"/></svg></button></div>
      <label for="pw2">Confirm password</label>
      <div class="password-wrap"><input id="pw2" type="password" autocomplete="new-password" required><button class="password-toggle" id="toggle-pw2" type="button" aria-label="Show confirmation password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.4 12s3.5-6 9.6-6 9.6 6 9.6 6-3.5 6-9.6 6-9.6-6-9.6-6Z"/><circle cx="12" cy="12" r="2.8"/></svg></button></div>

      <ul class="rules" id="rules">
        <li id="r-len">At least 12 characters</li>
        <li id="r-letter">At least one letter</li>
        <li id="r-digit">At least one number</li>
        <li id="r-match">Both entries match</li>
      </ul>

      <div class="msg" id="msg" role="alert"></div>
      <button type="submit" id="submit-btn">Set password &amp; continue</button>
    </div>

    <div class="foot">Authorized use only.</div>
  </form>
</div>

<script>
(function(){
  var form=document.getElementById('set-form');
  var pw=document.getElementById('pw'), pw2=document.getElementById('pw2');
  var togglePw=document.getElementById('toggle-pw'), togglePw2=document.getElementById('toggle-pw2');
  var btn=document.getElementById('submit-btn'), msg=document.getElementById('msg');
  var MIN=12;
  var ROLE=null;

  function roleHome(role){
    switch(role){
      case 'admin': return '/admin/users';
      case 'c_suite': return '/';
      case 'pm': return '/projects';   // #263 — pm lands on assigned-projects-only view
      case 'client': return '/welcome'; // #267 — external client hard-stop welcome/pending page
      case 'estimator': return '/estimating'; // #276 — the estimating workspace
      default: return null;   // super + other external — no onboarded home this phase
    }
  }
  function showMsg(t, kind){ msg.textContent=t; msg.className='msg show '+(kind||'err'); }
  function clearMsg(){ msg.className='msg'; msg.textContent=''; }

  function checks(){
    var v=pw.value, v2=pw2.value;
    var c={len:v.length>=MIN, letter:/[A-Za-z]/.test(v), digit:/[0-9]/.test(v), match:(v.length>0 && v===v2)};
    document.getElementById('r-len').className=c.len?'ok':'';
    document.getElementById('r-letter').className=c.letter?'ok':'';
    document.getElementById('r-digit').className=c.digit?'ok':'';
    document.getElementById('r-match').className=c.match?'ok':'';
    return c.len&&c.letter&&c.digit&&c.match;
  }
  pw.addEventListener('input',checks); pw2.addEventListener('input',checks);
  function togglePassword(input, button, showLabel, hideLabel){
    button.addEventListener('click',function(){
      var revealing=input.type==='password'; input.type=revealing?'text':'password';
      button.setAttribute('aria-label',revealing?hideLabel:showLabel);
      button.setAttribute('aria-pressed',String(revealing));
    });
  }
  togglePassword(pw,togglePw,'Show new password','Hide new password');
  togglePassword(pw2,togglePw2,'Show confirmation password','Hide confirmation password');

  // Greet by name; capture role for post-set routing.
  fetch('/api/auth/me',{credentials:'include'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(j&&j.user){ ROLE=j.user.role; var n=j.user.display_name||j.user.full_name||''; if(n) document.getElementById('welcome').textContent='Welcome, '+n+'. Choose a password to finish signing in.'; }
  }).catch(function(){});

  form.addEventListener('submit', async function(e){
    e.preventDefault(); clearMsg();
    if(!checks()){ showMsg('Please meet all the password requirements.'); return; }
    btn.disabled=true; btn.textContent='Saving…';
    try{
      var res=await fetch('/api/auth/set-password',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({new_password:pw.value})});
      var j=await res.json().catch(function(){return {};});
      if(res.ok){
        var role=(j&&j.role)||ROLE;
        var home=roleHome(role);
        if(home){ showMsg('Password set. Taking you in…','ok'); window.location.href=home; }
        else {
          // defined-not-onboarded role (super/external) — holding screen, NO data behind it
          document.getElementById('form-body').innerHTML='<h1>Password set</h1><div class="holding">Your account isn’t enabled for the dashboard yet. An administrator will turn on your access.</div>';
        }
        return;
      }
      showMsg((j&&j.error)||'Could not set your password. Try again.');
    }catch(err){ showMsg('Could not reach the server.'); }
    finally{ btn.disabled=false; btn.textContent='Set password & continue'; }
  });
})();
</script>
</body>
</html>
