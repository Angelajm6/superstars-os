<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/files/static/fonts/typography.css?v=1012">
<title>Sign in · Superstars Contracting</title>
<style>
  :root {
    --brand-red: #B11E2E; --ui: #24418C; --ui-deep: #1B3272;
    --brand-red-deep: #8B1623;
    --ink: #14161C;
    --cream: #FAF7F1;
    --paper: #FFFFFF;
    --hairline: #E8E4DD;
    --mute: #76777E;
    --bad: #B11E2E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background:
      radial-gradient(circle at 12% 14%, rgba(177,30,46,0.11), transparent 25rem),
      radial-gradient(circle at 88% 86%, rgba(20,22,28,0.07), transparent 28rem),
      var(--cream);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.96);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    box-shadow: 0 24px 64px rgba(20,22,28,0.12), 0 2px 8px rgba(20,22,28,0.04);
    padding: 36px 36px 30px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }
  .brand-mark { width: 40px; height: 40px; flex-shrink: 0; }
  .brand-text { line-height: 1.1; }
  .brand-name {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--ink);
    text-transform: uppercase;
  }
  .brand-sub {
    font-size: 10px;
    color: var(--mute);
    letter-spacing: 1.2px;
    text-transform: uppercase;
    font-weight: 600;
    margin-top: 2px;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .sub {
    font-size: 13px;
    color: var(--mute);
    margin-bottom: 22px;
  }
  label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--mute);
    margin-bottom: 6px;
    margin-top: 14px;
  }
  input[type="email"], .password-wrap input {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: 9px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  input[type="email"]:focus, .password-wrap input:focus {
    border-color: var(--ui);
    box-shadow: 0 0 0 3px rgba(36,65,140,0.15);
  }
  .password-wrap { position: relative; width:100%; }
  .password-wrap input { padding-right: 48px; }
  .password-toggle {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; margin: 0; padding: 0; border: 0; border-radius: 7px;
    color: var(--mute); background: transparent; display: grid; place-items: center;
  }
  .password-toggle:hover:not(:disabled), .password-toggle:focus-visible {
    background: #F7F4EE; color: var(--ink); outline: none;
  }
  .password-toggle svg { width: 18px; height: 18px; }
  .password-toggle svg[hidden] { display: none; }
  .password-help { display: flex; justify-content: flex-end; margin-top: 9px; }
  .forgot {
    width: auto; margin: 0; padding: 0; color: var(--ui); background: transparent;
    font-size: 12px; font-weight: 700; letter-spacing: 0; text-decoration: underline;
    text-underline-offset: 3px;
  }
  .forgot:hover:not(:disabled) { background: transparent; color: var(--ui-deep); }
  .err {
    background: #FBEAEC;
    color: var(--bad);
    border: 1px solid #F1C0C5;
    border-radius: 9px;
    padding: 9px 12px;
    font-size: 13px;
    margin-top: 16px;
    display: none;
  }
  .err.show { display: block; }
  .err.info { background: #F3F5F8; color: #384152; border-color: #DDE2EA; }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 11px 16px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: white;
    background: var(--ui);
    border: none;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover:not(:disabled) { background: var(--ui-deep); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .foot {
    margin-top: 18px;
    font-size: 11px;
    color: var(--mute);
    text-align: center;
    letter-spacing: 0.3px;
  }
  /* #261 — Google SSO (staff). Hidden until /api/auth/sso/config reports enabled. */
  .google-section[hidden] { display: none; }
  .btn-google {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; margin-top: 4px; padding: 10px 16px;
    font: inherit; font-size: 14px; font-weight: 700; letter-spacing: 0.3px;
    color: var(--ink); background: var(--paper);
    border: 1px solid var(--hairline); border-radius: 6px;
    cursor: pointer; text-decoration: none;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .btn-google:hover { background: #F7F4EE; border-color: #D8D3CA; }
  .btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }
  .or-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 18px 0 2px; color: var(--mute);
    font-size: 10px; letter-spacing: 0.8px; text-transform: uppercase; font-weight: 600;
  }
  .or-divider::before, .or-divider::after {
    content: ""; flex: 1; height: 1px; background: var(--hairline);
  }
  .brand-mark,.mark{object-fit:contain;}  /* #265 swap-safe logo */
  @media (max-width: 480px) {
    .wrap { padding: 16px; align-items: flex-start; padding-top: 56px; }
    .card { padding: 30px 24px 26px; border-radius: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <form class="card" id="login-form" autocomplete="on" novalidate>
    <div class="brand">
      <img class="brand-mark" src="/files/static/brand/mark.svg" alt="Superstars Contracting">
      <div class="brand-text">
        <div class="brand-name">Superstars Contracting</div>
        <div class="brand-sub">Office Console</div>
      </div>
    </div>

    <h1>Sign in</h1>
    <div class="sub">Staff: sign in with Google · Clients: email &amp; password. Workers use the worker app.</div>

    <div class="google-section" id="google-section" hidden>
      <a class="btn-google" id="google-btn" href="/auth/google/login" rel="nofollow">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </a>
      <div class="or-divider">or clients sign in</div>
    </div>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required autofocus>

    <label for="password">Password</label>
    <div class="password-wrap">
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="password-toggle" id="toggle-password" type="button" aria-label="Show password" aria-pressed="false">
        <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.4 12s3.5-6 9.6-6 9.6 6 9.6 6-3.5 6-9.6 6-9.6-6-9.6-6Z"/><circle cx="12" cy="12" r="2.8"/></svg>
        <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
    <div class="password-help"><button class="forgot" id="forgot-password" type="button">Forgot password?</button></div>

    <div class="err" id="err" role="alert"></div>

    <button type="submit" id="submit-btn">Sign in</button>

    <div class="foot">Authorized use only.</div>
  </form>
</div>

<script>
(function() {
  const form = document.getElementById('login-form');
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('err');
  const emailEl = document.getElementById('email');
  const pwEl = document.getElementById('password');
  const pwToggle = document.getElementById('toggle-password');
  const forgotPassword = document.getElementById('forgot-password');

  // Same-origin next= only. Reject absolute URLs, scheme-relative URLs, and
  // anything that doesn't start with "/" to block open-redirect.
  function safeNext() {
    const raw = new URLSearchParams(window.location.search).get('next') || '/';
    if (typeof raw !== 'string') return '/';
    if (!raw.startsWith('/') || raw.startsWith('//')) return '/';
    return raw;
  }

  // #257/#263 — role home: admin -> admin console, c_suite -> company console,
  // pm -> assigned-projects-only landing. Non-company roles (pm/super/…) never land
  // on the company console (it 403s for them); they go to /projects.
  // #267/#269 — a client is sent to /welcome; the grant-aware SERVER gate decides from
  // there: zero granted sections -> the welcome hard-stop stays; >=1 granted section ->
  // /welcome forwards to /portal (which renders ONLY the granted sections).
  function roleHome(role) {
    switch (role) {
      case 'admin': return '/admin/users';
      case 'c_suite': return '/';
      case 'pm': return '/projects';
      case 'client': return '/welcome';   // #269 — server gate forwards granted clients to /portal
      case 'estimator': return '/estimating';   // #276 — the estimating workspace
      default: return '/projects';
    }
  }

  function showErr(msg) {
    err.textContent = msg;
    err.classList.add('show');
  }
  function clearErr() {
    err.classList.remove('show');
    err.classList.remove('info');
    err.textContent = '';
  }

  // Eye toggle: swaps the input type AND the icon (eye -> eye-off), keeps the
  // accessible label/state in sync, and returns focus to the field.
  const pwIconShow = pwToggle.querySelector('.icon-show');
  const pwIconHide = pwToggle.querySelector('.icon-hide');
  pwToggle.addEventListener('click', () => {
    const revealing = pwEl.type === 'password';
    pwEl.type = revealing ? 'text' : 'password';
    pwToggle.setAttribute('aria-label', revealing ? 'Hide password' : 'Show password');
    pwToggle.setAttribute('aria-pressed', String(revealing));
    pwIconShow.hidden = revealing;
    pwIconHide.hidden = !revealing;
    pwEl.focus({ preventScroll: true });
  });

  forgotPassword.addEventListener('click', () => {
    window.location.href = '/forgot-password';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErr();
    const email = emailEl.value.trim();
    const password = pwEl.value;
    if (!email || !password) {
      showErr('Email and password are required.');
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ email, password })
      });
      if (res.ok) {
        const j = await res.json().catch(() => ({}));
        const u = (j && j.user) || {};
        // Forced first-login reset takes precedence over any destination.
        if (u.must_reset_password) { window.location.href = '/set-password'; return; }
        // Honor an explicit deep-link (?next=/some/page); otherwise the role home.
        const next = safeNext();
        window.location.href = (next && next !== '/') ? next : roleHome(u.role);
        return;
      }
      if (res.status === 401) {
        showErr('Email or password is incorrect.');
      } else if (res.status === 400) {
        showErr('Please enter your email and password.');
      } else {
        showErr('Sign-in is temporarily unavailable. Try again in a moment.');
      }
    } catch (e) {
      showErr('Could not reach the server.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });

  // ---- #261 Google SSO (staff) ----
  // Generic, PII-free messages for a callback that bounced back with ?sso_error=.
  const SSO_ERRORS = {
    notauthorized: 'Not authorized. Ask your admin to add your account.',
    domain: 'Use your @superstarscontracting.com Google account.',
    state: 'Your sign-in session expired — please try again.',
    denied: 'Google sign-in was cancelled.',
    verify: 'Could not verify your Google sign-in — please try again.'
  };
  (function showSsoError() {
    const code = new URLSearchParams(window.location.search).get('sso_error');
    if (code) showErr(SSO_ERRORS[code] || 'Google sign-in failed — please try again.');
  })();
  // Landing here from a completed password reset (/reset-password -> /login?reset=1).
  (function showResetDone() {
    if (new URLSearchParams(window.location.search).get('reset') !== '1') return;
    err.classList.add('info');
    showErr('Your password has been updated. Sign in with your new password.');
  })();
  // Reveal the Google button ONLY when SSO is enabled server-side (creds present).
  // If the config call fails, SSO stays hidden and email/password is unaffected.
  (async function initSso() {
    try {
      const r = await fetch('/api/auth/sso/config', {
        headers: { 'Accept': 'application/json' }, credentials: 'same-origin'
      });
      if (!r.ok) return;
      const j = await r.json();
      if (j && j.google && j.google.enabled) {
        const sec = document.getElementById('google-section');
        const gbtn = document.getElementById('google-btn');
        if (gbtn && j.google.login_url) gbtn.setAttribute('href', j.google.login_url);
        if (sec) sec.hidden = false;
      }
    } catch (e) { /* SSO stays hidden — email/password path unaffected */ }
  })();
})();
</script>
</body>
</html>
