<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password · Superstars Contracting</title><link rel="stylesheet" href="/files/static/fonts/typography.css"><style>body{margin:0;background:#faf7f1;font:16px Inter,Arial;color:#14161c}.card{max-width:420px;margin:12vh auto;padding:34px;background:#fff;border:1px solid #e8e4dd;border-radius:18px;box-shadow:0 24px 64px #14161c1f}h1{margin:0 0 8px}p{color:#76777e;line-height:1.5}label,input,button{display:block;width:100%;box-sizing:border-box}label{font-size:12px;font-weight:700;margin:22px 0 7px}input{padding:12px;border:1px solid #e8e4dd;border-radius:9px;font:inherit}button{margin-top:18px;padding:12px;background:#b11e2e;border:0;border-radius:9px;color:#fff;font-weight:700;font-size:15px}.msg{margin-top:16px;color:#384152;line-height:1.45}.back{display:block;margin-top:18px;color:#b11e2e}</style><main class="card"><h1>Reset your password</h1><p>Enter your work email and we’ll send a secure, one-time reset link.</p><form id="f"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><button>Send reset link</button></form><div class="msg" id="m" aria-live="polite"></div><a class="back" href="/login">Back to sign in</a></main><script>document.querySelector('#f').onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;let r=await fetch('/api/auth/password-reset/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});let j=await r.json();m.textContent=j.message||'Please try again.';b.disabled=false}</script></html>
