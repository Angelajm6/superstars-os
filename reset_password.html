<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password · Superstars Contracting</title><link rel="stylesheet" href="/files/static/fonts/typography.css"><style>body{margin:0;background:#faf7f1;font:16px Inter,Arial;color:#14161c}.card{max-width:420px;margin:12vh auto;padding:34px;background:#fff;border:1px solid #e8e4dd;border-radius:18px;box-shadow:0 24px 64px #14161c1f}h1{margin:0 0 8px}p{color:#76777e;line-height:1.5}label,input,button{display:block;width:100%;box-sizing:border-box}label{font-size:12px;font-weight:700;margin:18px 0 7px}.pw{position:relative}.pw input{padding:12px 48px 12px 12px;border:1px solid #e8e4dd;border-radius:9px;font:inherit}.eye{position:absolute;right:8px;top:6px;width:34px;height:34px;border:0;background:transparent;color:#76777e;font-size:18px}button.submit{margin-top:18px;padding:12px;background:#b11e2e;border:0;border-radius:9px;color:#fff;font-weight:700;font-size:15px}.msg{margin-top:16px;color:#b11e2e;line-height:1.45}</style><main class="card"><h1>Choose a new password</h1><p>Use at least 12 characters, including a letter and a number.</p><form id="f"><label>New password</label><div class="pw"><input id="pw" type="password" autocomplete="new-password" required><button class="eye" type="button" aria-label="Show password">◉</button></div><label>Confirm password</label><div class="pw"><input id="pw2" type="password" autocomplete="new-password" required><button class="eye" type="button" aria-label="Show password">◉</button></div><button class="submit">Reset password</button></form><div class="msg" id="m" aria-live="polite"></div></main><script>document.querySelectorAll('.eye').forEach(x=>x.onclick=()=>{let i=x.previousElementSibling;i.type=i.type==='password'?'text':'password';x.setAttribute('aria-label',i.type==='text'?'Hide password':'Show password')});document.querySelector('#f').onsubmit=async e=>{e.preventDefault();if(pw.value!==pw2.value){m.textContent='Passwords do not match.';return}let r=await fetch('/api/auth/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:new URLSearchParams(location.search).get('token')||'',new_password:pw.value})}),j=await r.json();if(r.ok){location.href='/login'}else m.textContent=j.error||'Could not reset password.'}</script></html>
