<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="stylesheet" href="/files/static/css/widgets.css?v=1008">
<link rel="stylesheet" href="/files/static/css/shell.css?v=1007">
<link rel="stylesheet" href="/files/static/css/chat.css?v=2">
<script src="/files/static/js/company_nav.js?v=1032"></script>
<script>try{if(localStorage.getItem('ssc.side.rail')==='1')document.documentElement.classList.add('side-rail')}catch(e){}</script>
<script src="/files/static/js/shell.js?v=1007" defer></script>
<script src="/files/static/js/auth_menu.js?v=1015" defer></script>
<script src="/files/static/js/datepicker.js?v=1007" defer></script>
<script src="/files/static/js/file_drop.js?v=1" defer></script>

<title>Chat · Superstars Contracting</title>
<link rel="icon" type="image/svg+xml" href="/files/static/brand/mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/files/static/brand/favicon-32.png">
<link rel="apple-touch-icon" href="/files/static/brand/apple-touch-icon.png">
<!-- Company chat (2026-11-16, accepted prototype https://claude.ai/artifact/C7oS45e2gZxt6wGGDC7VMs; chat.py, static/js/chat.js).
     Conversation list · the open chat · Files & people. Phone (<=860px): the list, or the open chat full screen.
     2026-11-17: the chat itself is chat_fragment.html (chat.py puts it in the CHAT_FRAGMENT marker below) and
     static/css/chat.css, shared with the floating Chat window on every other page (static/js/chat_widget.js). -->
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--canvas);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  [hidden]{display:none !important;}
  .brand-mark{object-fit:contain;}
  body.ch-page .ssc-shell{height:100vh;height:100dvh;min-height:0;}
  body.ch-page .ssc-main{display:flex;flex-direction:column;min-height:0;height:100vh;height:100dvh;overflow:hidden;}
  .ch{flex:1;display:flex;min-height:0;}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* the chat's own look is static/css/chat.css (shared with the floating Chat window); the page only lays out the shell */
  @media (max-width:860px){
    body.ch-page .ssc-shell{grid-template-rows:auto minmax(0,1fr);}
    body.ch-page .ssc-main{height:auto;}
    body.ch-page.ch-in .ssc-top{display:none;}
  }
</style>
</head>
<body class="ch-page">
<div class="ssc-shell">
<aside class="ssc-side" aria-label="Company navigation">
  <div class="brand">
    <img class="brand-mark" width="34" height="34" src="/files/static/brand/mark.svg" alt="Superstars Contracting">
    <img class="brand-full" src="/files/static/brand/logo-full.png" width="320" height="189" alt="Superstars Contracting Inc">
  </div>
  <nav class="ssc-nav" id="ssc-nav" data-company-nav></nav>
  <script>SSC_NAV.mount();</script>
</aside>
<div class="ssc-main">
<header class="ssc-top">
  <div class="ssc-top-title"><h1 data-nav-h1>Chat</h1></div>
  <div class="ssc-top-right"><span id="who" hidden></span><div id="user-menu" aria-live="polite"></div></div>
</header>
<!--CHAT_FRAGMENT-->
</div><!-- /.ssc-main -->
</div><!-- /.ssc-shell -->
</body>
</html>
