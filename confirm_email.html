<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="/files/static/fonts/typography.css?v=1014">
<title>Confirm your new email · Superstars Contracting</title>
<style>
  /* The link from the change-of-email message (email_change.py). Nothing changes until the
     Confirm button is pressed, so a mail scanner that opens the link does not confirm it. */
  :root { --ink: #1B1F27; --ink-2: #5B6170; --mute: #868C98; --line: #E6E8EE; --ui: #4364DC; --ui-deep: #2A47B8;
          --good: #0c7a5f; --good-soft: #e7f6f0; --bad: #A8382B; --bad-soft: #fceeec; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: radial-gradient(circle at 12% 14%, rgba(177,30,46,0.08), transparent 25rem), #F6F7F9;
               color: var(--ink); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
               -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 440px; background: #fff; border: 1px solid var(--line); border-radius: var(--r-card, 14px);
          box-shadow: 0 1px 2px rgba(20,22,28,.04), 0 12px 32px -10px rgba(20,22,28,.14); padding: 30px 30px 26px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .brand img { width: 36px; height: 36px; flex-shrink: 0; object-fit: contain; }
  .brand b { display: block; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .brand small { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 8px; }
  p { font-size: 14px; line-height: 1.55; color: var(--ink-2); }
  .btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; margin-top: 20px; padding: 11px 16px;
         font: inherit; font-size: 14px; font-weight: 600; border-radius: var(--r-inner, 10px); border: 1px solid var(--ui);
         background: var(--ui); color: #fff; cursor: pointer; text-decoration: none; }
  .btn:hover { background: var(--ui-deep); border-color: var(--ui-deep); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--ui); outline-offset: 2px; }
  .msg { margin-top: 16px; padding: 11px 13px; border-radius: var(--r-inner, 10px); font-size: 13.5px; line-height: 1.5; }
  .msg.ok { background: var(--good-soft); color: var(--good); }
  .msg.bad { background: var(--bad-soft); color: var(--bad); }
  .msg[hidden], .btn[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <div class="brand"><img src="/files/static/brand/mark.svg" alt="" width="36" height="36"><div><b>Superstars Contracting</b><small>Office console</small></div></div>
    <h1 id="title">Confirm your new email</h1>
    <p id="lead">Press the button to make this address your sign-in email. Your password, tasks and history stay the same.</p>
    <button class="btn" id="go" type="button">Confirm new email</button>
    <div class="msg" id="msg" role="status" hidden></div>
    <a class="btn" id="next" href="/login" hidden>Go to sign in</a>
  </main>
</div>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const token = new URLSearchParams(location.search).get('token') || '';
  function show(kind, text) { const m = $('msg'); m.className = 'msg ' + kind; m.textContent = text; m.hidden = false; }
  if (!token) {
    $('go').hidden = true;
    show('bad', 'This link is missing its code. Open the link from the email again, or ask for a new one from Settings → Account.');
    return;
  }
  $('go').addEventListener('click', async () => {
    $('go').disabled = true;
    try {
      const r = await fetch('/api/auth/email-change/confirm', { method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify({ token }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { show('bad', j.error || 'That did not work. Try again in a moment.'); $('go').disabled = false; return; }
      $('go').hidden = true;
      history.replaceState(null, '', location.pathname);   // the used code leaves the address bar
      $('title').textContent = 'Email changed';
      $('lead').textContent = 'Your sign-in email is now ' + ((j.data && j.data.email) || 'the new address') + '. Use it with your same password, or with Sign in with Google.';
      show('ok', 'Done. If you had connected Google Calendar or Gmail, connect them again from Settings → Account.');
      $('next').hidden = false;
    } catch (e) {
      show('bad', 'No connection. Check your internet and press the button again.');
      $('go').disabled = false;
    }
  });
})();
</script>
</body>
</html>
