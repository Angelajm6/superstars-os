<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/files/static/fonts/typography.css?v=1014">
<link rel="stylesheet" href="/files/static/css/widgets.css?v=1007">
<link rel="stylesheet" href="/files/static/css/shell.css?v=1007">
<script src="/files/static/js/company_nav.js?v=1017"></script>
<script src="/files/static/js/claude_drawer.js?v=12" defer></script>
<!-- #359 — apply a remembered collapsed rail before the first paint -->
<script>try{if(localStorage.getItem('ssc.side.rail')==='1')document.documentElement.classList.add('side-rail')}catch(e){}</script>
<script src="/files/static/js/shell.js?v=1007" defer></script>
<script src="/files/static/js/auth_menu.js?v=1009" defer></script>
<script src="/files/static/js/datepicker.js?v=1007" defer></script>
<script src="/files/static/js/inbox_schedule.js?v=4" defer></script>
<title>Inbox · Superstars Contracting</title>
<!-- Inbox for PMs and supers (prototype accepted 2026-10-16): "Mine" only — their own Google
     Calendar (private to them) + the tasks, events and meetings they are on. Admins and C-suite
     get Mail / Mine / All inside /company#inbox; /inbox redirects them there (inbox_schedule.py). -->
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--canvas);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  .brand-mark{object-fit:contain;}
  [hidden]{display:none !important;}
  .ssc-main{display:flex;flex-direction:column;min-height:100vh;}
  .ix-wrap{padding:20px 28px 40px;max-width:1060px;width:100%;}
  .ix-sub{color:var(--muted);margin:0 0 14px;font-size:14px;}
  @media (max-width:820px){.ix-wrap{padding:16px 16px 40px;}}
</style>
</head>
<body>
<div class="ssc-shell">
<aside class="ssc-side" aria-label="Company navigation">
  <div class="brand">
    <img class="brand-mark" width="34" height="34" src="/files/static/brand/mark.svg" alt="Superstars Contracting">
    <div><div class="brand-name">Superstars Contracting</div><div class="brand-sub">Company</div></div>
  </div>
  <nav class="ssc-nav" id="ssc-nav" data-company-nav></nav>
  <script>SSC_NAV.mount();</script>
</aside>
<div class="ssc-main">
<header class="ssc-top">
  <div class="ssc-top-title"><h1 data-nav-h1>Inbox</h1></div>
  <div class="ssc-top-right"><span id="who" hidden></span><div id="user-menu" aria-live="polite"></div></div>
</header>
<main class="ix-wrap" aria-label="Inbox">
  <p class="ix-sub">Your calendar and everything assigned to you. Only you see your calendar.</p>
  <div id="ix-sched"></div>
</main>
</div><!-- /.ssc-main -->
</div><!-- /.ssc-shell -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (window.SSC_SCHEDULE) window.SSC_SCHEDULE.mount(document.getElementById('ix-sched'), { scope: 'mine', admin: false, next: '/inbox' });
});
</script>
<link rel="stylesheet" href="/files/static/css/unify.css?v=6">
</body>
</html>
