<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/files/static/fonts/typography.css?v=1014">
<link rel="stylesheet" href="/files/static/css/widgets.css?v=1008">
<link rel="stylesheet" href="/files/static/css/shell.css?v=1007">
<script src="/files/static/js/company_nav.js?v=1033"></script>
<script src="/files/static/js/claude_drawer.js?v=22" defer></script>
<!-- #359 — apply a remembered collapsed rail before the first paint -->
<script>try{if(localStorage.getItem('ssc.side.rail')==='1')document.documentElement.classList.add('side-rail')}catch(e){}</script>
<script src="/files/static/js/shell.js?v=1007" defer></script>
<script src="/files/static/js/auth_menu.js?v=1016" defer></script>
<script src="/files/static/js/datepicker.js?v=1007" defer></script>
<link rel="stylesheet" href="/files/static/css/team_tasks.css?v=1" id="tt-css">
<script src="/files/static/js/team_tasks.js?v=1" defer data-team-tasks></script>
<script src="/files/static/js/inbox_schedule.js?v=6" defer></script>
<title>Inbox · Superstars Contracting</title>
<link rel="icon" type="image/svg+xml" href="/files/static/brand/mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/files/static/brand/favicon-32.png">
<link rel="apple-touch-icon" href="/files/static/brand/apple-touch-icon.png">
<!-- Inbox for PMs and supers (prototype accepted 2026-10-16): "My calendar" only (was "Mine", renamed 2026-10-23) — their own Google
     Calendar (private to them) + the tasks, events and meetings they are on. Admins and C-suite
     get Email / My calendar / Team inside /company#inbox; /inbox redirects them there (inbox_schedule.py). -->
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--canvas);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  .brand-mark{object-fit:contain;}
  [hidden]{display:none !important;}
  .ssc-main{display:flex;flex-direction:column;min-height:100vh;}
  .ix-wrap{padding:20px 28px 40px;max-width:1060px;width:100%;}
  .ix-sub{color:var(--muted);margin:0 0 14px;font-size:14px;}
  @media (max-width:820px){.ix-wrap{padding:16px 16px 40px;}}
  /* add a task for yourself or your crew (2026-11-19, team_tasks.js) */
  .ix-add{display:flex;gap:8px;align-items:flex-start;margin:0 0 16px}
  .ix-add .ix-quickwrap{flex:1;min-width:0}
  .ix-add .btn-primary{flex:none;min-height:44px}
  @media (max-width:640px){#ix-quick [data-tt-more]{display:none !important}}   /* + Task takes what you typed */
</style>
</head>
<body>
<div class="ssc-shell">
<aside class="ssc-side" aria-label="Company navigation">
  <div class="brand">
    <img class="brand-mark" width="34" height="34" src="/files/static/brand/mark.svg" alt="Superstars Contracting">
    <img class="brand-full" src="/files/static/brand/logo-full.png" width="320" height="189" alt="Superstars Contracting Inc">
  </div>
  <nav class="ssc-nav" id="ssc-nav" data-company-nav></nav>
  <script>SSC_NAV.mount();</script>
</aside>
<div class="ssc-main">
<header class="ssc-top">
  <div class="ssc-top-title"><h1 data-nav-h1>Inbox</h1></div>
  <div class="ssc-top-right"><span id="who" hidden></span><div id="user-menu" aria-live="polite"></div></div>
</header>
<main class="ix-wrap" aria-label="Inbox">
  <p class="ix-sub"><b>My calendar</b>: your Google Calendar and everything assigned to you. Only you see your calendar.</p>
  <div class="ix-add">
    <div class="ix-quickwrap">
      <form class="tt-quick" id="ix-quick" autocomplete="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        <input id="ix-quick-in" maxlength="200" placeholder="Add a task… e.g. Order anchors tomorrow 7am @Luis" aria-label="Add a task">
        <button type="button" class="btn-ghost btn-sm" data-tt-more>More</button>
      </form>
      <div class="tt-qchips" data-tt-chips hidden></div>
      <div class="tt-qhint" data-tt-hint>For you, or for the people on your jobs with @name. A day and a time are picked up. Press Enter to add.</div>
    </div>
    <button type="button" class="btn-primary" id="ix-new">+ Task</button>
  </div>
  <div id="ix-sched"></div>
</main>
</div><!-- /.ssc-main -->
</div><!-- /.ssc-shell -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  var sched = window.SSC_SCHEDULE ? window.SSC_SCHEDULE.mount(document.getElementById('ix-sched'), { scope: 'mine', admin: false, next: '/inbox' }) : null;
  if (window.SSC_TASKS) {
    window.SSC_TASKS.quick(document.getElementById('ix-quick'));
    document.getElementById('ix-new').addEventListener('click', function () {   // with something typed, + Task opens the window with it filled in
      var more = document.querySelector('#ix-quick [data-tt-more]');
      if (document.getElementById('ix-quick-in').value.trim() && more) more.click(); else window.SSC_TASKS.edit(null);
    });
  }
  document.addEventListener('ssc:items-changed', function () { if (sched && sched.reload) sched.reload(); });
});
</script>
<link rel="stylesheet" href="/files/static/css/unify.css?v=16">
<script src="/files/static/js/file_drop.js?v=1" defer></script>
</body>
</html>
