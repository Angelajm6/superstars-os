<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drop Plan — Superstars Contracting</title>
<style>
  :root {
    --ink:#14161C; --ink-soft:#54505A; --mute:#76777E;
    --brand-red:#B11E2E; --brand-red-dark:#8B1623;
    --bg:#FAF7F1; --card:#FFFFFF; --border:#E8E4DD;
    --ok:#2F7C57; --warn:#B68838; --track:#EDEAE3; --accent:#2F7C57;
    --radius:12px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { font-family:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45; }
  .header { background:var(--ink); color:#fff; padding:16px 28px; display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-mark { width:30px; height:30px; color:var(--brand-red); }
  .brand-name { font-weight:800; letter-spacing:.04em; text-transform:uppercase; font-size:13px; }
  .brand-sub { font-size:10px; color:#9b9ca0; letter-spacing:.08em; text-transform:uppercase; margin-top:2px; }
  .header-actions { display:flex; align-items:center; gap:16px; }
  .role-chip { background:#2a2c34; color:#fff; padding:4px 10px; border-radius:3px; font-size:10px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
  .back-link { color:#9b9ca0; font-size:12px; text-decoration:none; font-weight:600; cursor:pointer; }
  .back-link:hover { color:#fff; }
  main { padding:28px; max-width:1180px; margin:0 auto; }
  .eyebrow { font-size:11px; color:var(--mute); text-transform:uppercase; letter-spacing:.12em; font-weight:700; }
  h1 { margin:2px 0; font-size:24px; }
  .client-sub { font-size:12px; color:var(--brand-red); text-transform:uppercase; letter-spacing:.1em; font-weight:700; }

  /* KPI tiles */
  .kpis { display:flex; gap:14px; margin:18px 0 24px; flex-wrap:wrap; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px; min-width:150px; }
  .kpi .k { font-size:11px; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; }
  .kpi .v { font-weight:800; font-size:24px; margin-top:2px; }

  .elev-section { margin-bottom:24px; }
  .elev-head { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
  .elev-head h2 { margin:0; font-size:14px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); }
  .elev-head .cnt { font-size:12px; color:var(--mute); }
  .board { display:grid; grid-template-columns:repeat(auto-fill,minmax(252px,1fr)); gap:12px; }
  .drop-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; cursor:pointer; display:flex; gap:14px; align-items:center; transition:border-color .15s, box-shadow .15s; }
  .drop-card:hover { border-color:var(--brand-red); box-shadow:0 2px 10px rgba(0,0,0,.05); }
  .drop-card.lean { cursor:default; justify-content:space-between; background:#fcfbf8; }
  .drop-card.lean:hover { border-color:var(--border); box-shadow:none; }
  .dc-quiet { font-size:12px; color:var(--mute); margin-top:4px; }
  .dc-info { flex:1; min-width:0; }
  .dc-label { font-weight:800; font-size:15px; }
  .dc-stage { font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .dc-row { display:flex; gap:6px; align-items:center; margin-top:8px; flex-wrap:wrap; }

  /* circular ring */
  .ring text.ring-pct { font-size:15px; font-weight:800; fill:var(--ink); }
  .ring text.ring-sub { font-size:9px; fill:var(--mute); }
  .ring-lg text.ring-pct { font-size:26px; font-weight:800; fill:var(--ink); }
  .ring-lg text.ring-sub { font-size:12px; fill:var(--mute); }

  /* pills */
  .pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:99px; font-size:11px; font-weight:700; letter-spacing:.02em; border:1px solid var(--border); background:#fff; color:var(--ink-soft); cursor:default; }
  .pill.sm { font-size:10px; padding:2px 8px; }
  .pill-not_started { background:#f1efe9; color:#76777E; }
  .pill-in_progress { background:#fbf2dd; color:#8a6516; }
  .pill-complete { background:#e6f0ea; color:#2F7C57; }
  .pill-n_a { background:#eceaf2; color:#6b6480; }
  .chip { display:inline-block; padding:2px 8px; border-radius:99px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .chip-ahead { background:#e6f0ea; color:#2F7C57; }
  .chip-behind { background:#f7e0e2; color:#B11E2E; }
  .chip-on_track { background:#eef1f4; color:#54505A; }

  /* inline detail panel (accordion expand — NO navigation, NO URL change) */
  .drop-expand { grid-column:1 / -1; background:var(--bg); border:1px solid var(--brand-red); border-radius:var(--radius); padding:16px 18px; margin:2px 0 8px; }
  .detail-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .detail-head .eyebrow { color:var(--ink-soft); }
  .detail-top { display:flex; gap:24px; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px 24px; margin-bottom:18px; flex-wrap:wrap; }
  .detail-stats { display:flex; gap:28px; flex-wrap:wrap; }
  .stat .k { font-size:11px; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; }
  .stat .v { font-weight:700; font-size:16px; margin-top:2px; }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 22px; margin-bottom:18px; }
  .panel h3 { margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); }

  /* lean stage list */
  .step { border-bottom:1px solid #f2efe7; }
  .step-line { display:grid; grid-template-columns:26px 1fr 110px 120px 70px; gap:12px; align-items:center; padding:9px 0; cursor:pointer; }
  .step-line:hover { background:#fcfbf8; }
  .step-num { width:22px; height:22px; border-radius:50%; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--mute); }
  .step-num.done { background:var(--ok); border-color:var(--ok); color:#fff; }
  .step-name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .step-name .gate { font-size:9px; color:var(--warn); font-weight:700; text-transform:uppercase; margin-left:6px; }
  .step-date { font-size:12px; color:var(--ink-soft); }
  .step-date.empty { color:#c3bfb6; }
  .step-edit-link { font-size:11px; color:var(--brand-red); font-weight:700; text-align:right; }
  .step-editor { display:none; padding:12px 0 16px; }
  .step.editing .step-editor { display:block; }
  .step.editing .step-edit-link { color:var(--mute); }
  .pill-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .pill-opt { padding:6px 14px; border-radius:99px; border:1.5px solid var(--border); background:#fff; font-size:12px; font-weight:700; cursor:pointer; color:var(--ink-soft); }
  .pill-opt.active { border-color:var(--ink); color:var(--ink); background:#f6f4ef; }
  .pill-opt[data-st="complete"].active { border-color:var(--ok); color:var(--ok); background:#e6f0ea; }
  .pill-opt[data-st="in_progress"].active { border-color:var(--warn); color:#8a6516; background:#fbf2dd; }
  .pill-opt[data-st="n_a"].active { border-color:#6b6480; color:#6b6480; background:#eceaf2; }
  .editor-actions { display:flex; gap:8px; margin-top:12px; align-items:center; }

  /* inline calendar */
  .cal { width:280px; border:1px solid var(--border); border-radius:10px; padding:10px; background:#fff; }
  .cal-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .cal-title { flex:1; font-weight:700; font-size:13px; }
  .cal-nav { border:1px solid var(--border); background:#fff; border-radius:6px; width:26px; height:26px; cursor:pointer; font-size:14px; line-height:1; }
  .cal-today { border:1px solid var(--border); background:#fff; border-radius:6px; padding:3px 10px; font-size:11px; font-weight:700; cursor:pointer; color:var(--brand-red); }
  .cal-dow { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; font-size:10px; color:var(--mute); text-align:center; margin-bottom:2px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-day { text-align:center; padding:6px 0; font-size:12px; border-radius:6px; cursor:pointer; }
  .cal-day:hover { background:#f3f0ea; }
  .cal-day.empty { cursor:default; }
  .cal-day.today { box-shadow:inset 0 0 0 1.5px var(--brand-red); }
  .cal-day.sel { background:var(--ink); color:#fff; }

  /* patch entry */
  .patch-form { display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; background:#fbf9f5; border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px; }
  .dim { display:flex; flex-direction:column; gap:4px; }
  .dim label { font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); font-weight:700; }
  .dim-in { display:flex; gap:4px; align-items:center; }
  .dim-in input { width:72px; padding:7px 8px; border:1px solid var(--border); border-radius:6px; font-family:inherit; font-size:14px; }
  .unit-tog { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  .unit-tog button { border:none; background:#fff; padding:7px 9px; font-size:11px; font-weight:700; cursor:pointer; color:var(--mute); }
  .unit-tog button.active { background:var(--ink); color:#fff; }
  .live-vol { font-weight:800; font-size:15px; color:var(--ok); min-width:130px; }
  .patch-table { width:100%; border-collapse:collapse; font-size:13px; }
  .patch-table th { text-align:left; background:var(--ink); color:#fff; padding:7px 10px; font-size:10px; text-transform:uppercase; letter-spacing:.05em; }
  .patch-table td { padding:7px 10px; border-bottom:1px solid #f2efe7; }
  .patch-total { display:flex; gap:24px; align-items:baseline; margin-top:12px; }
  .patch-total .v { font-weight:800; font-size:22px; }

  .btn { background:#fff; color:var(--ink); border:1px solid var(--border); border-radius:6px; padding:8px 14px; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; }
  .btn:hover { background:var(--bg); border-color:var(--brand-red); }
  .btn-primary { background:var(--brand-red); color:#fff; border-color:var(--brand-red); }
  .btn-primary:hover { background:var(--brand-red-dark); }
  .btn-sm { padding:5px 10px; font-size:11px; }
  .btn-link { background:none; border:none; color:var(--brand-red); font-weight:700; font-size:12px; cursor:pointer; padding:2px 4px; }
  .err { color:var(--brand-red); font-size:12px; min-height:16px; }
  .err.ok { color:var(--ok); }
  .brand-mark,.mark{object-fit:contain;}  /* #265 swap-safe logo */
</style>
<script src="/files/static/js/auth_menu.js?v=1009" defer></script><!-- #292 — SSC_BOOT/SSC_PERF chrome (no #user-menu here: its me-fetch no-ops) -->
</head>
<body>
  <div class="header">
    <div class="brand">
      <img class="brand-mark" src="/files/static/brand/mark.svg" alt="Superstars Contracting">
      <div><div class="brand-name">Superstars Contracting</div><div class="brand-sub">Drop Plan</div></div>
    </div>
    <div class="header-actions">
      <span class="role-chip" id="hdr-role">…</span>
      <span id="hdr-user" style="font-size:12px;color:#9b9ca0;"></span>
      <a class="back-link" href="/">← Dashboard</a>
    </div>
  </div>

  <main>
    <!-- BOARD VIEW -->
    <div id="board-view">
      <div class="eyebrow">Project Drop Plan</div>
      <h1>890 E 135th St · FR-BX-001</h1>
      <div class="client-sub">Compass Point, LLC</div>
      <div class="kpis">
        <div class="kpi"><div class="k">Overall progress</div><div class="v" id="kpi-progress">—</div></div>
        <div class="kpi"><div class="k">Drops</div><div class="v" id="kpi-drops">—</div></div>
      </div>
      <div id="board"><div style="color:var(--mute);">Loading drops…</div></div>
    </div>

    <footer id="build-stamp" style="margin-top:32px;padding-top:14px;border-top:1px solid var(--border);color:var(--mute);font-size:11px;letter-spacing:.04em;">
      build #256 · 2026-06-20 · per-drop &amp; overall % derived live from stage completion; overall KPI refreshes on stage edit
    </footer>
  </main>

<script>
(function() {
  const $ = (id) => document.getElementById(id);
  const PROJECT = new URLSearchParams(location.search).get('project') || 'FR-BX-001';
  const ELEVS = ['North','West','South','East'];
  const STATUSES = [['not_started','Not started'],['in_progress','In progress'],['complete','Complete'],['n_a','N/A']];
  const esc = (s) => (s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'));
  function todayLocal(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fmtMDY(iso){ if(!iso) return ''; const p=String(iso).slice(0,10).split('-'); return p.length===3 ? `${p[1]}/${p[2]}/${p[0]}` : iso; }
  function jsCeilTenth(v){ if(v==null||isNaN(v)) return null; return Math.ceil(Number((Number(v)*10).toFixed(6)))/10; }

  let ROLE=null, DROPS=[], SOV=[], PATCH_SOV=null;

  function ringSVG(pct, complete, applicable, large){
    const size = large?150:54, stroke = large?14:7;
    const r=(size-stroke)/2, cx=size/2, C=2*Math.PI*r;
    const p=Math.max(0,Math.min(100, pct||0)), arc=p/100*C;
    const cls = large?'ring ring-lg':'ring';
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="${cls}">
      <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
      <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${arc.toFixed(2)} ${(C-arc).toFixed(2)}" transform="rotate(-90 ${cx} ${cx})"/>
      <text x="${cx}" y="${cx}" dy="0.05em" text-anchor="middle" dominant-baseline="middle" class="ring-pct">${p}%</text>
      ${large?`<text x="${cx}" y="${cx+24}" text-anchor="middle" class="ring-sub">${complete} / ${applicable} steps</text>`:''}
    </svg>`;
  }

  async function loadMe(){
    try{ const j=await (await fetch('/api/auth/me',{credentials:'include'})).json();
      if(j&&j.user){ ROLE=j.user.role||null; $('hdr-role').textContent=ROLE||'—'; $('hdr-user').textContent=j.user.full_name||j.user.email||''; }
    }catch(e){}
  }
  async function loadSov(){
    // #292 — cache-first (paint from last visit, live refresh diff-skips)
    const apply=d=>{ SOV=d||[]; PATCH_SOV = SOV.find(s=>s.unit==='CF'&&s.sov_code!=='COL-REPAIR') || SOV.find(s=>s.sov_code!=='COL-REPAIR') || null;   // #352 };
    try{
      if(window.SSC_PERF&&SSC_PERF.cacheFirstJSON&&window.SSC_BOOT){ await SSC_PERF.cacheFirstJSON('dropplan.sov.'+PROJECT, `/api/dropplan/projects/${encodeURIComponent(PROJECT)}/sov-lines`, apply); }
      else{ const j=await (await fetch(`/api/dropplan/projects/${encodeURIComponent(PROJECT)}/sov-lines`,{credentials:'include'})).json(); apply((j&&j.data)||[]); }
    }catch(e){}
  }

  function lifecyclePill(lc){ return `<span class="pill sm pill-${esc(lc)}">${esc((lc||'').replace(/_/g,' '))}</span>`; }
  function varianceChip(wd){ if(!wd||wd.status==='no_actuals') return ''; const lbl=wd.status==='on_track'?'on track':wd.status; return `<span class="chip chip-${esc(wd.status)}" title="planned ${wd.planned_to_date_days}d / actual ${wd.actual_to_date_days}d">${esc(lbl)} ${wd.planned_to_date_days}/${wd.actual_to_date_days}d</span>`; }

  function cardHtml(d){
    // Activate model (#204): only ACTIVE drops (lifecycle beyond not_started)
    // show a ring + current stage. Not-started drops are lean, quiet cards
    // with an Activate button (no ring, no redundant stage label).
    const active = d.lifecycle && d.lifecycle !== 'not_started';
    if(!active){
      return `<div class="drop-card lean">
        <div class="dc-info"><div class="dc-label">Drop ${d.sequence_no}</div>
          <div class="dc-quiet">${esc(d.elevation||'')} · not started</div></div>
        <button type="button" class="btn btn-sm" data-activate="${esc(d.drop_id)}">Activate</button></div>`;
    }
    const pct=(d.progress&&d.progress.pct!=null)?d.progress.pct:0;
    const comp=d.progress?d.progress.complete_steps:0, app=d.progress?d.progress.applicable_steps:0;
    const stage=d.current_stage?`Step ${d.current_stage.step_no} · ${esc(d.current_stage.name)}`:'all steps done';
    return `<div class="drop-card active" data-open="${esc(d.drop_id)}">
      ${ringSVG(pct,comp,app,false)}
      <div class="dc-info">
        <div class="dc-label">Drop ${d.sequence_no}</div>
        <div class="dc-stage">${stage}</div>
        <div class="dc-row">${lifecyclePill(d.lifecycle)}${varianceChip(d.working_days)}</div>
      </div></div>`;
  }
  async function activateDrop(id){
    try{
      const r=await fetch(`/api/dropplan/drops/${encodeURIComponent(id)}`,{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({lifecycle:'scaffold_active'})});
      if(r.ok){ await loadBoard(); await loadRollup(); }
    }catch(e){}
  }

  function renderBoard(data){
    const board=$('board');
    DROPS=data||[];
    collapseDrop();   // rebuilding the board wipes any open panel — reset accordion state
    let html='';
    for(const e of ELEVS){ const ds=DROPS.filter(d=>d.elevation===e); if(!ds.length) continue;
      html+=`<div class="elev-section"><div class="elev-head"><h2>${esc(e)}</h2><span class="cnt">${ds.length} drops</span></div><div class="board">${ds.map(cardHtml).join('')}</div></div>`; }
    board.innerHTML=html||'<div style="color:var(--mute);">No drops.</div>';
  }
  async function loadBoard(){
    const board=$('board');
    try{
      // #292 — cache-first: last visit's board paints instantly; the live
      // fetch re-renders ONLY if drops changed (flag-#5 diff inside).
      if(window.SSC_PERF&&SSC_PERF.cacheFirstJSON&&window.SSC_BOOT){
        await SSC_PERF.cacheFirstJSON('dropplan.board.'+PROJECT,
          `/api/dropplan/projects/${encodeURIComponent(PROJECT)}/drops`, renderBoard);
        return;
      }
      const r=await fetch(`/api/dropplan/projects/${encodeURIComponent(PROJECT)}/drops`,{credentials:'include'});
      if(r.status===401){ location.href='/login?next=/dropplan'; return; }
      if(r.status===403){ board.innerHTML='<div style="color:var(--brand-red);">Forbidden — your role cannot view the drop plan.</div>'; return; }
      renderBoard(((await r.json()).data)||[]);
    }catch(e){ board.innerHTML='<div style="color:var(--brand-red);">Network error — retry.</div>'; }
  }
  function renderRollup(d){
    d=d||{};
    $('kpi-progress').textContent=(d.overall_progress_pct!=null?d.overall_progress_pct:0)+'%';
    $('kpi-drops').textContent=d.drop_count!=null?d.drop_count:'—';
    // Cost / spend deliberately NOT shown on this page (#205): drops + quantities
    // only. Cost lives in the future Spend module; the API still omits it for pm/super.
  }
  async function loadRollup(){
    try{
      if(window.SSC_PERF&&SSC_PERF.cacheFirstJSON&&window.SSC_BOOT){
        await SSC_PERF.cacheFirstJSON('dropplan.rollup.'+PROJECT,
          `/api/dropplan/projects/${encodeURIComponent(PROJECT)}/rollup`, renderRollup);
        return;
      }
      const d=((await (await fetch(`/api/dropplan/projects/${encodeURIComponent(PROJECT)}/rollup`,{credentials:'include'})).json()).data)||{};
      renderRollup(d);
    }catch(e){}
  }

  // ---------- inline calendar ----------
  function buildCalendar(container, selectedISO){
    let sel=selectedISO||null;
    let view=sel?new Date(sel+'T00:00:00'):new Date();
    function draw(){
      const y=view.getFullYear(), m=view.getMonth();
      const startDow=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate(), tISO=todayLocal();
      let cells=''; for(let i=0;i<startDow;i++) cells+='<div class="cal-day empty"></div>';
      for(let d=1;d<=dim;d++){ const iso=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        const cl=['cal-day']; if(iso===tISO)cl.push('today'); if(iso===sel)cl.push('sel');
        cells+=`<div class="${cl.join(' ')}" data-iso="${iso}">${d}</div>`; }
      container.innerHTML=`<div class="cal-head"><button type="button" class="cal-nav" data-cal="prev">‹</button>
        <span class="cal-title">${view.toLocaleString('en-US',{month:'long'})} ${y}</span>
        <button type="button" class="cal-nav" data-cal="next">›</button>
        <button type="button" class="cal-today" data-cal="today">Today</button></div>
        <div class="cal-dow"><div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div></div>
        <div class="cal-grid">${cells}</div>`;
      container.dataset.iso=sel||'';
    }
    container.onclick=(e)=>{
      const day=e.target.closest('.cal-day[data-iso]');
      if(day){ sel=day.dataset.iso; container.dataset.iso=sel; draw(); return; }
      const nav=e.target.closest('[data-cal]'); if(!nav) return;
      const a=nav.dataset.cal;
      if(a==='prev') view.setMonth(view.getMonth()-1);
      else if(a==='next') view.setMonth(view.getMonth()+1);
      else if(a==='today'){ const t=new Date(); view=new Date(t.getFullYear(),t.getMonth(),1); sel=todayLocal(); }
      draw();
    };
    draw();
  }

  // ---------- per-drop INLINE expand (accordion — NO navigation, NO URL change) ----------
  // Clicking an active card injects a full-width panel as the card's NEXT SIBLING
  // inside the board grid (grid-column:1/-1). The board + every other card stay in
  // the DOM and the URL never changes — clicking again or the collapse control just
  // removes the panel. This replaces the #204 URL-driven view-swap (history.pushState
  // + show/hide #detail-view) that read as "a different page" and went blank on the
  // operator's real browser. There is no navigation here, so navigate-to-blank is
  // structurally impossible.
  let CUR_DROP=null, CUR_PANEL=null;

  function detailInnerHtml(d){
    const pr=d.progress||{}, wd=d.working_days||{};
    const stageRows=(d.stages||[]).map(stepRowHtml).join('');
    return `
      <div class="detail-head">
        <div class="eyebrow">${esc(d.drop_id||'')} · ${esc(d.elevation||'')} · Drop ${esc(d.sequence_no)}</div>
        <button type="button" class="btn btn-sm" data-collapse>▲ Collapse</button>
      </div>
      <div class="detail-top">
        ${ringSVG(pr.pct||0, pr.complete_steps||0, pr.applicable_steps||0, true)}
        <div style="flex:1;">
          <h1 style="margin:2px 0 8px;">Drop ${esc(d.sequence_no)}</h1>
          <div class="detail-stats">
            <div class="stat"><div class="k">Lifecycle</div><div class="v">${lifecyclePill(d.lifecycle)}</div></div>
            <div class="stat"><div class="k">Current stage</div><div class="v">${d.current_stage?('Step '+d.current_stage.step_no):'—'}</div></div>
            <div class="stat"><div class="k">Planned / actual days</div><div class="v">${(wd.planned_to_date_days!=null?wd.planned_to_date_days:0)} / ${(wd.actual_to_date_days!=null?wd.actual_to_date_days:0)} ${varianceChip(wd)}</div></div>
          </div>
        </div>
      </div>
      <div class="panel"><h3>Stage pipeline</h3><div id="steps">${stageRows}</div></div>
      <div class="panel"><h3>Concrete patches · ${esc(PATCH_SOV?PATCH_SOV.sov_code:'')}</h3><div id="patch-section"></div></div>`;
  }

  async function fetchDrop(dropId){
    const resp = await fetch(`/api/dropplan/drops/${encodeURIComponent(dropId)}`,{credentials:'include'});
    if(resp.status===401){ location.href='/login?next='+encodeURIComponent('/dropplan'); return null; }
    if(!resp.ok){ throw new Error('detail HTTP '+resp.status); }
    const d=((await resp.json()).data)||null;
    if(!d){ throw new Error('no drop data'); }
    return d;
  }

  // Render (or re-render) the expanded panel's contents IN PLACE. Returns the
  // drop detail so callers can keep the board card's small ring in sync.
  async function renderPanel(panel, dropId){
    panel.innerHTML='<div class="panel" style="margin:0;">Loading…</div>';
    let d;
    try { d=await fetchDrop(dropId); if(!d) return null; }
    catch(err){
      // Defensive: explicit error + retry, NEVER a silent blank (the panel stays
      // on the board, so the board is never lost even on a fetch failure).
      panel.innerHTML='<div class="panel" style="margin:0;color:var(--brand-red);">Could not load Drop '+esc(dropId)+' — <button type="button" class="btn btn-sm" data-retry>Retry</button></div>';
      const rb=panel.querySelector('[data-retry]'); if(rb) rb.addEventListener('click',()=>renderPanel(panel,dropId));
      return null;
    }
    panel.innerHTML=detailInnerHtml(d);
    bindSteps();
    await loadPatches();
    return d;
  }

  function collapseDrop(){
    if(CUR_PANEL){ CUR_PANEL.remove(); CUR_PANEL=null; }
    CUR_DROP=null;
  }

  // Re-render just this card from fresh detail data so its ring / current-stage /
  // pill reflect inline edits — without rebuilding the whole board (which would
  // tear down the open panel). Returns the replacement node.
  function refreshCard(cardEl, d){
    const tmp=document.createElement('div'); tmp.innerHTML=cardHtml(d).trim();
    const fresh=tmp.firstElementChild;
    if(fresh && cardEl && cardEl.parentNode){ cardEl.replaceWith(fresh); return fresh; }
    return cardEl;
  }

  async function toggleDrop(cardEl, dropId){
    if(CUR_DROP===dropId && CUR_PANEL){ collapseDrop(); return; }  // same card → close
    collapseDrop();                                                // accordion: close any other
    CUR_DROP=dropId;
    const panel=document.createElement('div');
    panel.className='drop-expand';
    panel.setAttribute('data-detail', dropId);
    cardEl.insertAdjacentElement('afterend', panel);   // full-width sibling, beneath the card
    CUR_PANEL=panel;
    await renderPanel(panel, dropId);
  }

  // After an inline edit: re-render the open panel AND refresh its board card.
  async function reloadOpen(){
    if(!CUR_PANEL||!CUR_DROP) return;
    const card=CUR_PANEL.previousElementSibling;
    const d=await renderPanel(CUR_PANEL, CUR_DROP);
    if(d && card) refreshCard(card, d);
    await loadRollup();   // #256 — a stage edit moves the OVERALL %; refresh the top KPI live (no manual reload)
  }

  function stepRowHtml(s){
    const gate = s.is_cure_gate?'<span class="gate">cure gate</span>':(s.is_signoff_gate?'<span class="gate">sign-off</span>':'');
    const dateISO = s.completed_on || s.started_on || '';
    const done = s.status==='complete';
    return `<div class="step" data-step="${s.step_no}" data-status="${esc(s.status)}" data-date="${esc(dateISO)}">
      <div class="step-line">
        <div class="step-num ${done?'done':''}">${done?'✓':s.step_no}</div>
        <div class="step-name">${esc(s.name)}${gate}</div>
        <div class="step-date ${dateISO?'':'empty'}">${dateISO?fmtMDY(dateISO):'— no date —'}</div>
        <div><span class="pill pill-${esc(s.status)}">${esc(STATUSES.find(x=>x[0]===s.status)?STATUSES.find(x=>x[0]===s.status)[1]:s.status)}</span></div>
        <div class="step-edit-link">Edit</div>
      </div>
      <div class="step-editor">
        <div class="pill-row">${STATUSES.map(([v,l])=>`<button type="button" class="pill-opt ${v===s.status?'active':''}" data-st="${v}">${l}</button>`).join('')}</div>
        <div class="cal" data-cal-for="${s.step_no}"></div>
        <div class="editor-actions">
          <button type="button" class="btn btn-primary btn-sm" data-savestep="${s.step_no}">Save</button>
          <button type="button" class="btn btn-sm" data-cancelstep="${s.step_no}">Cancel</button>
          <span class="err" data-err="${s.step_no}"></span>
        </div>
      </div></div>`;
  }
  function bindSteps(){
    $('steps').querySelectorAll('.step').forEach(step=>{
      const line=step.querySelector('.step-line');
      line.addEventListener('click',()=>{
        const open=step.classList.contains('editing');
        $('steps').querySelectorAll('.step.editing').forEach(s=>s.classList.remove('editing'));
        if(open) return;
        step.classList.add('editing');
        buildCalendar(step.querySelector('.cal'), step.dataset.date||todayLocal());
      });
      step.querySelector('.pill-row').addEventListener('click',(e)=>{
        const b=e.target.closest('.pill-opt'); if(!b) return;
        step.querySelectorAll('.pill-opt').forEach(p=>p.classList.remove('active')); b.classList.add('active');
      });
      step.querySelector('[data-savestep]').addEventListener('click',()=>saveStep(step));
      step.querySelector('[data-cancelstep]').addEventListener('click',()=>step.classList.remove('editing'));
    });
  }
  async function saveStep(step){
    const stepNo=step.dataset.step;
    const activePill=step.querySelector('.pill-opt.active');
    const status=activePill?activePill.getAttribute('data-st'):null;
    const iso=step.querySelector('.cal').dataset.iso||'';
    const err=step.querySelector('[data-err="'+stepNo+'"]');
    const body={status: status||'not_started'};
    // map the single chosen date to the field that matches the status
    if(iso){ if((status||'')==='complete') body.completed_on=iso; else body.started_on=iso; }
    const r=await fetch(`/api/dropplan/drops/${encodeURIComponent(CUR_DROP)}/stages/${stepNo}`,{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.ok){ await reloadOpen(); } else { const j=await r.json().catch(()=>({})); err.textContent='Save failed: '+((j&&j.error)||r.status); }
  }

  // ---------- concrete patches ----------
  let PATCH_UNITS={length:'ft',width:'ft',depth:'ft'};
  function patchFormHtml(){
    const dim=(k,lbl)=>`<div class="dim"><label>${lbl}</label><div class="dim-in">
      <input type="number" step="0.01" min="0" inputmode="decimal" data-dim="${k}" placeholder="0">
      <span class="unit-tog" data-unit-for="${k}"><button type="button" data-u="ft" class="${PATCH_UNITS[k]==='ft'?'active':''}">ft</button><button type="button" data-u="in" class="${PATCH_UNITS[k]==='in'?'active':''}">in</button></span></div></div>`;
    return `<div class="patch-form">
      ${dim('length','Length')}${dim('width','Width')}${dim('depth','Depth')}
      <div class="dim"><label>Volume (live)</label><div class="live-vol" id="live-vol">— CF</div></div>
      <button type="button" class="btn btn-primary" id="add-patch">Add patch</button>
      <span class="err" id="patch-err"></span>
    </div>
    <div id="patch-list"></div>`;
  }
  function liveVol(){
    const get=k=>{ const el=document.querySelector(`[data-dim="${k}"]`); return el&&el.value!==''?parseFloat(el.value):null; };
    const f=(v,u)=>v==null?null:(u==='in'?v/12:v);
    const l=f(get('length'),PATCH_UNITS.length), w=f(get('width'),PATCH_UNITS.width), d=f(get('depth'),PATCH_UNITS.depth);
    const lv=$('live-vol');
    if(l!=null&&w!=null&&d!=null){ lv.textContent=jsCeilTenth(l*w*d).toFixed(1)+' CF'; } else { lv.textContent='— CF'; }
  }
  async function loadPatches(){
    const sec=$('patch-section'); sec.innerHTML=patchFormHtml();
    bindPatchForm();
    const j=await (await fetch(`/api/dropplan/drops/${encodeURIComponent(CUR_DROP)}/quantity-entries`,{credentials:'include'})).json();
    const patches=((j&&j.data)||[]).filter(e=>e.volume_cf!=null&&e.sov_code!=='COL-REPAIR');   // #352 — column repairs are logged on the project dashboard
    const list=$('patch-list');
    if(!patches.length){ list.innerHTML='<div style="color:var(--mute);font-size:13px;padding:6px 0;">No patches logged yet.</div>'; return; }
    let sum=0; patches.forEach(p=>sum+=p.volume_cf);
    list.innerHTML=`<table class="patch-table"><thead><tr><th>#</th><th>L</th><th>W</th><th>D</th><th>Volume (CF)</th><th></th></tr></thead><tbody>
      ${patches.map((p,i)=>patchRowHtml(p,i+1)).join('')}</tbody></table>
      <div class="patch-total"><div><div class="k" style="font-size:11px;color:var(--mute);text-transform:uppercase;">Total volume</div><div class="v">${jsCeilTenth(sum).toFixed(1)} CF</div></div>
      <div><div class="k" style="font-size:11px;color:var(--mute);text-transform:uppercase;">Patch count</div><div class="v">${patches.length}</div></div></div>`;
    bindPatchRows();
  }
  function patchRowHtml(p,n){
    return `<tr data-entry="${p.entry_id}">
      <td>${n}</td>
      <td>${p.length} ${esc(p.length_unit)}</td><td>${p.width} ${esc(p.width_unit)}</td><td>${p.depth} ${esc(p.depth_unit)}</td>
      <td>${jsCeilTenth(p.volume_cf).toFixed(1)}</td>
      <td style="text-align:right;"><button type="button" class="btn-link" data-editpatch="${p.entry_id}">Edit</button> <button type="button" class="btn-link" data-delpatch="${p.entry_id}">Remove</button></td></tr>`;
  }
  function bindPatchForm(){
    $('patch-section').querySelectorAll('[data-unit-for]').forEach(tog=>{
      tog.addEventListener('click',(e)=>{ const b=e.target.closest('button[data-u]'); if(!b) return; const k=tog.getAttribute('data-unit-for'); PATCH_UNITS[k]=b.getAttribute('data-u'); tog.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); liveVol(); });
    });
    $('patch-section').querySelectorAll('[data-dim]').forEach(inp=>inp.addEventListener('input',liveVol));
    $('add-patch').addEventListener('click',addPatch);
  }
  function bindPatchRows(){
    $('patch-list').querySelectorAll('[data-delpatch]').forEach(b=>b.addEventListener('click',()=>delPatch(b.getAttribute('data-delpatch'))));
    $('patch-list').querySelectorAll('[data-editpatch]').forEach(b=>b.addEventListener('click',()=>editPatch(b.getAttribute('data-editpatch'))));
  }
  async function addPatch(){
    const err=$('patch-err'); err.textContent=''; err.className='err';
    const get=k=>{ const el=document.querySelector(`[data-dim="${k}"]`); return el&&el.value!==''?parseFloat(el.value):null; };
    const l=get('length'), w=get('width'), d=get('depth');
    if(l==null||w==null||d==null){ err.textContent='Enter length, width, and depth.'; return; }
    const body={sov_line_item:PATCH_SOV.sov_id, length:l, width:w, depth:d, length_unit:PATCH_UNITS.length, width_unit:PATCH_UNITS.width, depth_unit:PATCH_UNITS.depth, logged_on:todayLocal()};
    const r=await fetch(`/api/dropplan/drops/${encodeURIComponent(CUR_DROP)}/quantity-entries`,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.ok){ await loadPatches(); } else { const j=await r.json().catch(()=>({})); err.textContent=(j&&j.error)||('Add failed ('+r.status+')'); }
  }
  async function delPatch(id){
    const r=await fetch(`/api/dropplan/quantity-entries/${id}`,{method:'DELETE',credentials:'include'});
    if(r.ok) await loadPatches();
  }
  function editPatch(id){
    const row=$('patch-list').querySelector(`tr[data-entry="${id}"]`);
    const tds=row.querySelectorAll('td');
    const cur=(td)=>td.textContent.trim().split(' ');
    const mk=(k)=>{ const [val,un]=cur(tds[k.idx]); return `<div class="dim-in"><input type="number" step="0.01" min="0" data-edim="${k.name}" value="${val}" style="width:58px;">
      <span class="unit-tog" data-eunit="${k.name}"><button type="button" data-u="ft" class="${un==='ft'?'active':''}">ft</button><button type="button" data-u="in" class="${un==='in'?'active':''}">in</button></span></div>`; };
    tds[1].innerHTML=mk({idx:1,name:'length'}); tds[2].innerHTML=mk({idx:2,name:'width'}); tds[3].innerHTML=mk({idx:3,name:'depth'});
    tds[5].innerHTML=`<button type="button" class="btn-link" data-savepatch="${id}">Save</button> <button type="button" class="btn-link" data-cancelpatch>Cancel</button>`;
    row.querySelectorAll('[data-eunit]').forEach(t=>t.addEventListener('click',e=>{ const b=e.target.closest('button[data-u]'); if(!b)return; t.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); }));
    row.querySelector('[data-savepatch]').addEventListener('click',async()=>{
      const gv=n=>parseFloat(row.querySelector(`[data-edim="${n}"]`).value);
      const gu=n=>row.querySelector(`[data-eunit="${n}"] button.active`).getAttribute('data-u');
      const body={length:gv('length'),width:gv('width'),depth:gv('depth'),length_unit:gu('length'),width_unit:gu('width'),depth_unit:gu('depth')};
      const r=await fetch(`/api/dropplan/quantity-entries/${id}`,{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(r.ok) await loadPatches();
    });
    row.querySelector('[data-cancelpatch]').addEventListener('click',loadPatches);
  }

  // events — card click toggles the inline panel; collapse control closes it.
  // The panel is a SIBLING of the card (not inside [data-open]), so its own
  // clicks never re-trigger this handler. No popstate / no back-link: there is
  // no navigation to react to.
  document.addEventListener('click',(e)=>{
    if(e.target.closest('[data-collapse]')){ collapseDrop(); return; }
    const c=e.target.closest('[data-open]'); if(c){ toggleDrop(c, c.getAttribute('data-open')); return; }
    const a=e.target.closest('[data-activate]'); if(a){ activateDrop(a.getAttribute('data-activate')); return; }
  });

  (async function init(){
    await loadMe(); await loadSov(); await Promise.all([loadBoard(), loadRollup()]);
  })();
})();
</script>
</body>
</html>
