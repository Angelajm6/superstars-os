<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<link rel="stylesheet" href="/files/static/fonts/typography.css?v=1014">
  <script src="/files/static/js/datepicker.js?v=1007"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RFI Submission Form</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #FAF7F1;
      color: #14161C;
      line-height: 1.6;
    }

    .letterhead {
      background-color: #14161C;
      color: white;
      padding: 20px 16px;
      text-align: center;
      border-bottom: 2px solid #B11E2E;
    }
    .letterhead-brand {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 24px;
      margin-bottom: 4px;
    }
    .letterhead-star { color: #B11E2E; margin-right: 8px; }
    .letterhead-address {
      font-size: 11px;
      color: #ccc;
      letter-spacing: 0.05em;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    .form-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin: 24px 0 8px 0;
      color: #14161C;
    }

    .form-subtitle {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #76777E;
      margin-bottom: 24px;
    }

    .section {
      background: white;
      border: 1px solid #E8E4DD;
      margin-bottom: 12px;
      border-radius: 2px;
    }

    .section-header {
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FAFAFA;
      border-bottom: 1px solid #E8E4DD;
    }

    .section-header.expanded { background: white; }

    .section-header h3 {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }

    .section-header .eyebrow {
      display: block;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #76777E;
      margin-bottom: 4px;
    }

    .section-header .chevron {
      font-size: 18px;
      color: #76777E;
      transition: transform 0.2s;
    }

    .section-header.expanded .chevron { transform: rotate(180deg); }

    .section-content {
      padding: 16px;
      display: none;
    }

    .section-content.expanded { display: block; }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-weight: 500;
      font-size: 13px;
      margin-bottom: 6px;
      color: #14161C;
    }

    .required::after { content: ' *'; color: #B11E2E; }

    input[type="text"],
    input[type="email"],
    input[type="date"],
    input[type="file"],
    textarea,
    select {
      width: 100%;
      padding: 10px 8px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      border: 1px solid #E8E4DD;
      border-radius: 2px;
      color: #14161C;
      min-height: 40px;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="date"]:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border: 2px solid #B11E2E;
      padding: 9px 7px;
    }

    input[type="text"].readonly-display {
      background-color: #F5F5F5;
      color: #76777E;
      cursor: default;
    }

    input[type="text"].readonly-display:focus {
      border: 1px solid #E8E4DD;
      padding: 10px 8px;
    }

    textarea { resize: vertical; min-height: 80px; }

    .input-error {
      border: 2px solid #B11E2E !important;
    }

    .error-text {
      font-size: 11px;
      color: #B11E2E;
      margin-top: 4px;
    }

    .radio-group,
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .radio-item,
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="radio"],
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      min-width: 18px;
      cursor: pointer;
    }

    .radio-item label,
    .checkbox-item label {
      margin: 0;
      cursor: pointer;
      font-weight: 400;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #76777E;
      padding: 8px 0;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .submit-button {
      width: 100%;
      padding: 12px 16px;
      background-color: #B11E2E;
      color: white;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      border-radius: 2px;
      margin-top: 24px;
      min-height: 44px;
    }

    .submit-button:hover { background-color: #8B1724; }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 4px;
      max-width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      text-align: center;
    }

    .modal-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .modal-text {
      font-size: 14px;
      margin-bottom: 20px;
      color: #76777E;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .modal-button {
      padding: 10px 20px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      border-radius: 2px;
      min-height: 44px;
      min-width: 120px;
    }

    .modal-button.primary {
      background-color: #B11E2E;
      color: white;
    }

    .modal-button.secondary {
      background-color: #E8E4DD;
      color: #14161C;
    }

    .json-display {
      background: #F5F5F5;
      padding: 12px;
      border-radius: 2px;
      font-family: monospace;
      font-size: 11px;
      max-height: 300px;
      overflow-y: auto;
      text-align: left;
      margin: 12px 0;
    }

    .section-summary {
      background: #F5F5F5;
      padding: 8px 12px;
      border-radius: 2px;
      font-size: 12px;
      color: #76777E;
    }
  </style>
</head>
<body>
  <div class="letterhead">
    <div class="letterhead-brand"><span class="letterhead-star">★</span>SUPERSTARS</div>
    <div class="letterhead-address">890 EAST 135TH STREET, BRONX, NY 10454</div>
  </div>

  <div class="container">
    <h1 class="form-title">Request for Information</h1>
    <p class="form-subtitle">RFI Submission</p>

    <!-- Live "on site today" header (#116). Reads from the shared
         /api/projects/<code>/on-site endpoint that also feeds the
         project dashboard's Workers-Today widget — single source of
         truth. Visual redesign comes in Session 2; this is just the
         wiring. -->
    <div id="rfi-onsite-card" style="background:white;border:1px solid #E8E4DD;border-left:3px solid #B11E2E;border-radius:3px;padding:12px 14px;margin-bottom:18px;font-size:12px;color:#14161C;line-height:1.5;">
      <div style="font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:#76777E;font-weight:600;margin-bottom:4px;">On Site Today</div>
      <div id="rfi-onsite-header">Loading…</div>
    </div>

    <form id="rfiForm">
      <!-- Section 1 — Project Information (rfi_number assigned server-side
           on submit; date_submitted defaults to LOCAL today via SSCDatePicker) -->
      <div class="section">
        <div class="section-header expanded" data-section="project">
          <div>
            <span class="eyebrow">Section 1</span>
            <h3>Project Information</h3>
          </div>
          <span class="chevron">▼</span>
        </div>
        <div class="section-content expanded">
          <div class="form-group">
            <label>RFI Number</label>
            <input type="text" id="rfiNumber" value="auto-assigned on submit" readonly class="readonly-display">
          </div>
          <div class="form-group">
            <label class="required">Date Submitted</label>
            <input type="text" id="dateSubmitted" required placeholder="YYYY-MM-DD">
          </div>
          <div class="form-group">
            <label class="required">Submitted By</label>
            <input type="text" id="submittedBy" required placeholder="GC / sub / EOR name">
          </div>
          <div class="form-group">
            <label class="required">Sent To</label>
            <input type="text" id="sentTo" required placeholder="Architect / Engineer / Owner's rep">
          </div>
        </div>
      </div>

      <!-- Section 2 — Subject + the question itself (spec: subject_title +
           question_description). Title is the scannable register column. -->
      <div class="section">
        <div class="section-header" data-section="subject">
          <div>
            <span class="eyebrow">Section 2</span>
            <h3>Subject &amp; Question</h3>
          </div>
          <span class="chevron">▼</span>
        </div>
        <div class="section-content">
          <div class="form-group">
            <label class="required">Subject (short, scannable)</label>
            <input type="text" id="subjectTitle" maxlength="120" required placeholder="e.g. Lintel detail at North L7">
          </div>
          <div class="form-group">
            <label class="required">Question</label>
            <textarea id="questionDescription" required placeholder="What are you asking? Include the spec or sheet number if relevant."></textarea>
          </div>
          <div class="form-group">
            <label>Drawing / Spec Reference</label>
            <input type="text" id="drawingSpecReference" placeholder="e.g. A-501 detail 3 / Spec 04 21 13 §2.2">
          </div>
          <div class="form-group">
            <label>Related Documents (link or note)</label>
            <input type="text" id="relatedDocuments" placeholder="Change orders, submittals, prior RFIs…">
          </div>
        </div>
      </div>

      <!-- Section 3 — Location (the shared spine). location_unit options
           are populated from /api/projects/<code>/project-config so the
           dropdown auto-adapts when the project type changes (Phase 1). -->
      <div class="section">
        <div class="section-header" data-section="location">
          <div>
            <span class="eyebrow">Section 3</span>
            <h3>Location on Site</h3>
          </div>
          <span class="chevron">▼</span>
        </div>
        <div class="section-content">
          <div class="form-group">
            <label>Location Unit</label>
            <select id="locationUnit">
              <option value="">— select —</option>
              <!-- options injected from /api/projects/<code>/project-config -->
            </select>
          </div>
          <div class="form-group">
            <label class="required">Location ID</label>
            <!-- When location_unit='Drop' is selected, the input is backed
                 by a datalist of the project's canonical drops (DP-001..,
                 grouped via the option's data-elevation). The free-text
                 input stays so non-Drop locations (Bay/Floor/etc.) can be
                 typed by hand without rewriting the spine schema. -->
            <input type="text" id="locationId" required placeholder="e.g. DP-003 — pick from the list when unit = Drop" list="locationIdList" autocomplete="off">
            <datalist id="locationIdList"></datalist>
          </div>
          <div class="form-group">
            <label>Scope Category</label>
            <input type="text" id="scopeCategory" list="scopeCategoryList" placeholder="Pick from typical scopes or type a custom one">
            <!-- datalist populated from /api/projects/<code>/project-config -->
            <datalist id="scopeCategoryList"></datalist>
          </div>
        </div>
      </div>

      <!-- Section 4 — Response window + impact flags (the linkage_rules
           spine). date_response_required drives Auto-Overdue + turnaround. -->
      <div class="section">
        <div class="section-header" data-section="impact">
          <div>
            <span class="eyebrow">Section 4</span>
            <h3>Response &amp; Impact</h3>
          </div>
          <span class="chevron">▼</span>
        </div>
        <div class="section-content">
          <div class="form-group">
            <label class="required">Response Required By</label>
            <input type="text" id="dateResponseRequired" required placeholder="YYYY-MM-DD">
          </div>
          <div class="form-group">
            <label>Impact Flags</label>
            <div class="checkbox-group">
              <div class="checkbox-item">
                <input type="checkbox" id="scheduleImpact">
                <label for="scheduleImpact">Schedule impact (Open RFIs with this flag become Look-Ahead constraints)</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="costImpact">
                <label for="costImpact">Cost impact</label>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>Impact Magnitude Note</label>
            <textarea id="impactMagnitudeNote" placeholder="Why does this affect schedule / cost? (e.g. 'gates demo at L7 start')"></textarea>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-button">Submit RFI</button>
    </form>
  </div>

  <div id="confirmModal" class="modal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">RFI Submitted</div>
      <div class="modal-text" id="modalText"></div>
      <div class="json-display" id="jsonDisplay"></div>
      <div class="modal-buttons">
        <button class="modal-button secondary" id="submitAnotherBtn">Submit Another</button>
      </div>
    </div>
  </div>

  <script>
    // ---- Project context. Project-prefixed rfi_number assignment + every
    // option-list lookup is scoped to this project. Hard-coded today
    // because the operator only has FR-BX-001; if the form is ever served
    // for a different project, lift this from the URL.
    const PROJECT_CODE = 'FR-BX-001';

    // ---- LOCAL date helper (the dates rule #74). Form fields store
    // YYYY-MM-DD via the SSCDatePicker; never UTC.
    function rfiTodayLocal() {
      const d = new Date();
      return d.getFullYear() + '-'
           + String(d.getMonth() + 1).padStart(2, '0') + '-'
           + String(d.getDate()).padStart(2, '0');
    }

    const form = document.getElementById('rfiForm');
    const modal = document.getElementById('confirmModal');

    // Wire SSCDatePicker on both date fields. Default date_submitted to
    // local today; leave date_response_required blank — the operator picks.
    // Seed before wiring; wire() will promote the YYYY-MM-DD .value into
    // (dataset.iso=YYYY-MM-DD, .value=MM-DD-YYYY).
    document.getElementById('dateSubmitted').value = rfiTodayLocal();
    if (window.SSCDatePicker) {
      SSCDatePicker.wire(document.getElementById('dateSubmitted'));
      SSCDatePicker.wire(document.getElementById('dateResponseRequired'));
    }

    // Accordion behavior — unchanged.
    document.querySelectorAll('.section-header').forEach(header => {
      header.addEventListener('click', () => {
        const section = header.closest('.section');
        const content = section.querySelector('.section-content');
        header.classList.toggle('expanded');
        content.classList.toggle('expanded');
      });
    });

    // ---- Populate location_unit + scope_category from the shared
    // project-config endpoint (Phase 1). Single source — every list the
    // form offers must come from project_type_config.py via this endpoint.
    async function loadProjectConfig() {
      try {
        const resp = await fetch('/api/projects/' + encodeURIComponent(PROJECT_CODE) + '/project-config').then(r => r.json());
        const cfg = (resp && resp.data) || null;
        if (!cfg) return;
        const luSel = document.getElementById('locationUnit');
        if (luSel && Array.isArray(cfg.location_unit_options)) {
          for (const opt of cfg.location_unit_options) {
            const o = document.createElement('option');
            o.value = opt; o.textContent = opt;
            luSel.appendChild(o);
          }
        }
        const scList = document.getElementById('scopeCategoryList');
        if (scList && Array.isArray(cfg.typical_scopes)) {
          for (const opt of cfg.typical_scopes) {
            const o = document.createElement('option');
            o.value = opt;
            scList.appendChild(o);
          }
        }
      } catch (e) {
        console.warn('[RFI] project-config load failed:', e);
      }
      // Drops from the new /locations endpoint — populates the datalist
      // backing the Location ID input when the operator picks
      // location_unit='Drop'. Free-text entry still works for non-Drop
      // units (Bay/Floor/Elevation/etc.) without rewriting the spine.
      await loadProjectDrops();
    }

    async function loadProjectDrops() {
      const dlist = document.getElementById('locationIdList');
      if (!dlist) return;
      try {
        const resp = await fetch('/api/projects/' + encodeURIComponent(PROJECT_CODE) + '/locations').then(r => r.json());
        const data = (resp && resp.data) || null;
        if (!data || !Array.isArray(data.flat)) return;
        dlist.innerHTML = data.flat.map(d => {
          // value = the canonical location_id (DP-NNN); label hints
          // elevation + status so the operator picks confidently.
          const label = d.label + (d.status && d.status !== 'pending' ? ' · ' + d.status : '');
          return '<option value="' + esc(d.location_id) + '">' + esc(label) + '</option>';
        }).join('');
      } catch (e) {
        console.warn('[RFI] /locations load failed:', e);
      }
    }
    function esc(s) {
      return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.querySelector('.submit-button');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      // Build the spec-shaped payload. All field names match
      // construction_builds_spec.json rfi_log.fields verbatim.
      // Date inputs are wired by SSCDatePicker — canonical YYYY-MM-DD lives
      // on dataset.iso (the visible .value is MM-DD-YYYY). Use getISO so
      // the spec-shaped payload stays YYYY-MM-DD regardless of display.
      const _iso = (id) => {
        const el = document.getElementById(id);
        return window.SSCDatePicker ? SSCDatePicker.getISO(el) : ((el && el.value || '').trim());
      };
      const payload = {
        project_code:           PROJECT_CODE,
        subject_title:          document.getElementById('subjectTitle').value.trim(),
        submitted_by:           document.getElementById('submittedBy').value.trim(),
        sent_to:                document.getElementById('sentTo').value.trim(),
        date_submitted:         _iso('dateSubmitted') || rfiTodayLocal(),
        date_response_required: _iso('dateResponseRequired'),
        question_description:   document.getElementById('questionDescription').value.trim(),
        drawing_spec_reference: document.getElementById('drawingSpecReference').value.trim() || null,
        related_documents:      document.getElementById('relatedDocuments').value.trim() || null,
        location_unit:          document.getElementById('locationUnit').value || null,
        location_id:            document.getElementById('locationId').value.trim(),
        scope_category:         document.getElementById('scopeCategory').value.trim() || null,
        schedule_impact_flag:   document.getElementById('scheduleImpact').checked,
        cost_impact_flag:       document.getElementById('costImpact').checked,
        impact_magnitude_note:  document.getElementById('impactMagnitudeNote').value.trim() || null,
      };

      try {
        const response = await fetch('/api/rfis', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload),
        });
        const body = await response.json().catch(() => ({}));
        if (response.status === 201 && body.data && body.data.rfi_number) {
          const d = body.data;
          document.getElementById('modalTitle').textContent = d.rfi_number + ' submitted';
          const locText = (d.location_unit || d.location_id)
            ? (d.location_unit || '') + (d.location_unit && d.location_id ? ' / ' : '') + (d.location_id || '')
            : '—';
          const _fmt = (s) => (window.SSCDatePicker ? (SSCDatePicker.fmtMDY(s) || '—') : (s || '—'));
          document.getElementById('modalText').innerHTML =
            '<strong>RFI saved.</strong><br>' +
            '<strong>' + d.rfi_number + '</strong> — ' + (d.subject_title || '') + '<br>' +
            'Sent to: ' + (d.sent_to || '—') + ' · Response due: ' + (d.date_response_required ? _fmt(d.date_response_required) : '—') + '<br>' +
            'Location: ' + locText +
            (d.schedule_impact_flag ? ' · <em style="color:#B11E2E;">Schedule impact</em>' : '') +
            (d.cost_impact_flag ? ' · <em style="color:#B11E2E;">Cost impact</em>' : '');
          document.getElementById('jsonDisplay').textContent = '';
          // Update the disabled rfi_number field so the operator sees the assignment
          document.getElementById('rfiNumber').value = d.rfi_number;
        } else {
          document.getElementById('modalTitle').textContent = 'Submission failed';
          document.getElementById('modalText').innerHTML =
            '<strong>Error:</strong> ' + (body.error || ('HTTP ' + response.status));
        }
      } catch (err) {
        document.getElementById('modalTitle').textContent = 'Connection error';
        document.getElementById('modalText').innerHTML =
          '<strong>Error:</strong> ' + (err.message || String(err));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit RFI';
        modal.classList.add('active');
      }
    });

    document.getElementById('submitAnotherBtn').addEventListener('click', () => {
      form.reset();
      // Reseed dateSubmitted via setISO so the wired input picks up both
      // dataset.iso (YYYY-MM-DD) and .value (MM-DD-YYYY display).
      const _ds = document.getElementById('dateSubmitted');
      if (window.SSCDatePicker) SSCDatePicker.setISO(_ds, rfiTodayLocal());
      else _ds.value = rfiTodayLocal();
      if (window.SSCDatePicker) SSCDatePicker.setISO(document.getElementById('dateResponseRequired'), '');
      document.getElementById('rfiNumber').value = 'auto-assigned on submit';
      modal.classList.remove('active');
    });

    // ---- Live on-site header (#116). Reads /api/projects/<code>/on-site,
    // refreshes every 30s. Independent of the form submission path.
    async function loadOnSiteHeader() {
      const hdr = document.getElementById('rfi-onsite-header');
      if (!hdr) return;
      try {
        const today = rfiTodayLocal();
        const resp = await fetch('/api/projects/' + encodeURIComponent(PROJECT_CODE) + '/on-site?date=' + today).then(r => r.json());
        const d = (resp && resp.data) || null;
        if (!d) { hdr.textContent = 'On-site roster unavailable.'; return; }
        if (d.headcount === 0) {
          hdr.textContent = 'No workers currently signed in (' + today + ').';
          return;
        }
        const names = (d.workers || []).map(w => {
          const wid = w.worker_id ? (w.worker_id + ' ') : '';
          return wid + (w.name || '—');
        });
        const foremanLabel = d.foreman
          ? ' · Foreman: ' + (d.foreman.worker_id || '') + ' ' + (d.foreman.name || '')
          : '';
        hdr.textContent =
          d.headcount + ' on site today (' + today + '): ' +
          names.join(', ') + foremanLabel;
      } catch (e) {
        hdr.textContent = 'On-site roster unavailable.';
        console.warn('[RFI] on-site header load failed:', e);
      }
    }

    // Kickoff
    loadProjectConfig();
    loadOnSiteHeader();
    setInterval(loadOnSiteHeader, 30 * 1000);
  </script>
