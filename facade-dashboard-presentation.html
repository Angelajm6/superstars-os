const ToastContext = React.createContext(null);

const ToastProvider = ({ children }) => {
  const [toasts, setToasts] = React.useState([]);
  const fire = React.useCallback((text, type = 'success') => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, text, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  }, []);
  return (
    <ToastContext.Provider value={fire}>
      {children}
      <div className="fixed top-20 right-6 z-50 space-y-2 pointer-events-none">
        {toasts.map(t => (
          <div key={t.id} className={`px-4 py-3 rounded-md shadow-pop max-w-sm pointer-events-auto ${t.type === 'success' ? 'bg-okSoft text-ok border border-ok/30' : t.type === 'error' ? 'bg-badSoft text-bad border border-bad/30' : 'bg-warnSoft text-warn border border-warn/30'}`}>
            <div className="text-sm font-medium">{t.text}</div>
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
};

const STATUS_TONE = {
  ok:        { bg:'bg-okSoft',      fg:'text-ok',      dot:'bg-ok',      ring:'ring-ok/20'      },
  warn:      { bg:'bg-warnSoft',    fg:'text-warn',    dot:'bg-warn',    ring:'ring-warn/25'    },
  bad:       { bg:'bg-badSoft',     fg:'text-bad',     dot:'bg-bad',     ring:'ring-bad/25'     },
  neutral:   { bg:'bg-neutralSoft', fg:'text-neutral', dot:'bg-neutral', ring:'ring-neutral/20' },
};
const tone = (label) => {
  const s = (label || '').toLowerCase();
  if (/(complete|valid|active|current|passed|approved|on track|answered|verified|connected|executed|distributed|on file|final|signed in|ok)/.test(s)) return 'ok';
  if (/(progress|expiring|near|pending|under review|scheduled|response filed|attention|delay|swarmp|marginal|in progress)/.test(s)) return 'warn';
  if (/(expired|overdue|critical|red|failed|missing|not submitted|incident|violation|disputed|no-work|blocked)/.test(s)) return 'bad';
  return 'neutral';
};
const Badge = ({ label, status }) => {
  const t = STATUS_TONE[status || tone(label)];
  return (
    <span className={`pill ${t.bg} ${t.fg}`}>
      <span className={`dot ${t.dot}`}></span>{label}
    </span>
  );
};

const BudgetBreakdown = () => {
  // Aggregate SOV by trade
  const tradeOf = (n) => {
    if (n.startsWith('01.') || n.startsWith('11.')) return 'GC / Conditions';
    if (n.startsWith('02.')) return 'Mobilization & Scaffold';
    if (n.startsWith('03.')) return 'Investigation';
    if (n.startsWith('04.')) return 'Masonry';
    if (n.startsWith('07.')) return 'Waterproofing';
    if (n.startsWith('09.')) return 'Coatings';
    if (n.startsWith('10.')) return 'Punch & Demob';
    return 'Other';
  };
  const trades = {};
  SOV.forEach(s => {
    const k = tradeOf(s.num);
    trades[k] = trades[k] || { trade:k, original:0, co:0, spent:0 };
    trades[k].original += s.val;
    trades[k].spent += s.val * (s.prior + s.current) / 100;
  });
  // Apply some change orders by trade name match
  CHANGE_ORDERS.forEach(co => {
    if (co.status !== 'Approved') return;
    const k = co.trade === 'Masonry' ? 'Masonry'
            : co.trade === 'Waterproofing' ? 'Waterproofing'
            : co.trade === 'GC' ? 'GC / Conditions'
            : co.trade;
    if (trades[k]) trades[k].co += co.amount;
  });
  const rows = Object.values(trades).map(r => {
    const revised = r.original + r.co;
    const consumed = revised ? (r.spent / revised) * 100 : 0;
    const projected = r.spent * 1.04 + (revised - r.spent) * 1.01;
    const variance = revised - projected;
    let stat = 'ok';
    if (consumed > 90) stat = 'warn';
    if (projected > revised) stat = 'bad';
    return { ...r, revised, consumed, projected, variance, stat };
  });
  return (
    <Card>
      <SectionTitle title="Budget by trade" subtitle="Revised contract reflects approved change orders" action={<Btn kind="ghost" size="sm" icon={<I.Download size={14}/>}>Export</Btn>}/>
      <Table dense
        columns={[
          { key:'trade', label:'Trade / Subcontractor' },
          { key:'original', label:'Original ($)', align:'right', render:(r)=> fmt$(r.original) },
          { key:'co', label:'Approved CO', align:'right', render:(r)=> r.co ? fmt$(r.co) : '—' },
          { key:'revised', label:'Revised', align:'right', render:(r)=> fmt$(r.revised) },
          { key:'spent', label:'Spent', align:'right', render:(r)=> fmt$(r.spent) },
          { key:'consumed', label:'% Cons.', align:'right', render:(r)=> <Badge label={fmtPct(r.consumed)} status={r.stat}/> },
          { key:'projected', label:'Projected Final', align:'right', render:(r)=> fmt$(r.projected) },
          { key:'variance', label:'Variance', align:'right', render:(r)=> <span className={r.variance < 0 ? 'text-bad font-semibold' : 'text-ok font-semibold'}>{r.variance < 0 ? '-' : '+'}{fmt$(Math.abs(r.variance))}</span> },
        ]}
        rows={rows}
      />
    </Card>
  );
};

const ClosureModule = () => {
  const closures = { data: [] };
  const toast = useToast();
  const [checks, setChecks] = useState({});
  
  const updateChecklistItem = async (fieldKey, value) => {
    try {
      const todayKey = '2026-05-05';
      const todayClosure = (closures.data || []).find(c => c.date === todayKey);
      if (!todayClosure) {
        toast('No closure found for today', 'error');
        return;
      }
      const resp = await fetch(`${API_BASE}/api/site-closures/${todayClosure.closure_id}/checklist`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({item: fieldKey, value})
      });
      if (!resp.ok) throw new Error('Update failed');
      toast(`Saved: ${fieldKey}`, 'success');
      closures.refresh();
    } catch (e) {
      toast(`Failed: ${e.message}`, 'error');
    }
  };
  
  const toggle = (k) => {
    setChecks(s => ({ ...s, [k]: !s[k] }));
    updateChecklistItem(k, !checks[k]);

      'All workers have signed out',

      <Card>
        <div className="grid grid-cols-2 gap-x-10 gap-y-6">

const SOVModule = () => {

  const retainage = earned * 0.05;
  return (
    <div className="space-y-6">
      <SectionTitle title="Schedule of values · Pay App #04" subtitle="AIA G702 / G703 ready · Period: April 1–30, 2026"
        action={<div className="flex gap-2"><Btn kind="ghost" size="sm" icon={<I.Download size={14}/>}>Export G703</Btn><Btn size="sm" icon={<I.Download size={14}/>}>Generate Pay App</Btn></div>}/>

      <div className="grid grid-cols-5 gap-3">
        <Stat label="Contract total"  value={fmt$(totalContract)} sub="original" status="neutral"/>
        <Stat label="Earned to date"  value={fmt$(earned)} sub={`${fmtPct(earned/totalContract*100)} of contract`} status="ok"/>
        <Stat label="Earned this period" value={fmt$(earnedThis)} sub="April 2026" status="ok"/>
        <Stat label="Retainage held" value={fmt$(retainage)} sub="5%" status="neutral"/>
        <Stat label="Net this period" value={fmt$(earnedThis * 0.95)} sub="less retainage" status="ok"/>
      </div>

      <Card>
        <Table dense
          columns={[
            { key:'num', label:'Item #' },
            { key:'desc', label:'Description of work' },
            { key:'val', label:'Sched. value', align:'right', render:(r)=> fmt$(r.val) },
            { key:'prior', label:'% prior', align:'right', render:(r)=> `${r.prior}%` },
            { key:'current', label:'% this period', align:'right', render:(r)=> r.current > 0 ? <span className="text-warn font-semibold">+{r.current}%</span> : '0%' },
            { key:'total', label:'Total %', align:'right', render:(r)=> {
              const total = r.prior + r.current;
              return <span className={total === 100 ? 'text-ok font-bold' : ''}>{total}%</span>;
            }},
            { key:'completed', label:'Completed $', align:'right', render:(r)=> fmt$(r.val * (r.prior + r.current) / 100) },
            { key:'balance', label:'Balance', align:'right', render:(r)=> fmt$(r.val * (100 - r.prior - r.current) / 100) },
            { key:'retainage', label:'Retainage 5%', align:'right', render:(r)=> fmt$(r.val * (r.prior + r.current) / 100 * 0.05) },
          ]}
          rows={SOV}

        <div className="grid grid-cols-4 gap-3 text-sm">

          <div><span className="text-mute">Net change by COs</span><div className="font-display font-bold text-ink">{fmt$(CHANGE_ORDERS.filter(c=>c.status==='Approved').reduce((a,b)=>a+b.amount,0))}</div></div>

      </Card>
    </div>
  );
};

const DropPlanModule = () => {
  const drops = { data: [] };
  const toast = useToast();
  const [filter, setFilter] = React.useState('All');
  
  const dropData = Array.isArray(drops.data) ? drops.data : [];
  const filtered = filter === 'All' ? dropData : dropData.filter(d => d.status === filter);
  
  const updateDropStatus = async (dropId, newStatus) => {
    try {
      const resp = await fetch(`${API_BASE}/api/drops/${dropId}/status`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({status: newStatus})
      });
      if (!resp.ok) throw new Error('Status update failed');
      toast(`Drop ${dropId} status: ${newStatus}`, 'success');
      drops.refresh();
    } catch (e) {
      toast(`Failed: ${e.message}`, 'error');
    }
  };
  
  const signOffDrop = async (dropId, role) => {
    try {
      const resp = await fetch(`${API_BASE}/api/drops/${dropId}/sign-off`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({role, signed_by_employee_id: 'E-001', date: todayLocal()})
      });
      const json = await resp.json();
      if (!resp.ok) throw new Error(json.error || 'Sign-off failed');
      toast(`${role} signed off on ${dropId}`, 'success');
      drops.refresh();
    } catch (e) {
      toast(`Sign-off failed: ${e.message}`, 'error');
    }
  };
  
  const statusBg = (status) => {
    const map = {
      'Active': '#FFA500',
      'Planned': '#9CA3AF',
      'Signed Off': '#10B981',
      'Pending Sign-Off': '#FCA5A5',
      'Work Complete': '#10B981',
    };
    return map[status] || '#9CA3AF';

  const stats = [

    { label: 'Pending Sign-Off', value: dropData.filter(d => d.sign_off_status === 'Pending').length, bg: '#FEE2E2' },
    { label: 'Completed', value: dropData.filter(d => d.status === 'Signed Off').length, bg: '#ECFDF5' },
  ];
  
  return (
