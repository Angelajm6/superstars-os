<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/files/static/fonts/typography.css?v=1014">
<title>Welcome · Superstars Triton</title>
<link rel="icon" type="image/svg+xml" href="/files/static/brand/mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/files/static/brand/favicon-32.png">
<link rel="apple-touch-icon" href="/files/static/brand/apple-touch-icon.png">
<!-- #267 — client welcome / pending hard-stop. Self-contained (inline CSS + animation,
     offline-safe, no CDN). Canonical #265 brand star (swappable asset). A beautiful,
     intentional dead-end: NO navigation to anything but Sign out. -->
<style>
  :root{
    --brand-red:#B11E2E; --brand-red-lit:#E23A4E;
    --ink-0:#0A0B0F; --ink-1:#101219;
    --cream:#F3EEE4; --cream-soft:#CFC9BE; --muted:#8E8A83;
    --gold:#D9B871;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--ink-0);
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:32px 22px; position:relative; overflow:hidden;
  }
  /* ---- aurora background: soft, slow-drifting warm light on a near-black base ---- */
  .bg-base{position:fixed; inset:0; z-index:0;
    background:radial-gradient(120% 90% at 50% -10%, #1a1620 0%, #0F1017 46%, var(--ink-0) 100%);}
  .aurora{position:fixed; inset:-20%; z-index:0; filter:blur(70px); opacity:.9; pointer-events:none;}
  .blob{position:absolute; border-radius:50%; opacity:.55; will-change:transform;}
  .b1{width:46vmax; height:46vmax; left:-6vmax; top:-8vmax;
      background:radial-gradient(circle at 50% 50%, rgba(226,58,78,.55), rgba(177,30,46,0) 68%);
      animation:drift1 34s ease-in-out infinite;}
  .b2{width:40vmax; height:40vmax; right:-8vmax; bottom:-10vmax;
      background:radial-gradient(circle at 50% 50%, rgba(217,184,113,.34), rgba(217,184,113,0) 66%);
      animation:drift2 42s ease-in-out infinite;}
  .b3{width:34vmax; height:34vmax; left:38%; top:44%;
      background:radial-gradient(circle at 50% 50%, rgba(120,36,54,.5), rgba(120,36,54,0) 70%);
      animation:drift3 38s ease-in-out infinite;}
  .grain{position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
    background-image:radial-gradient(rgba(255,255,255,.6) .5px, transparent .5px);
    background-size:3px 3px;}
  .vignette{position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(120% 100% at 50% 42%, transparent 52%, rgba(0,0,0,.55) 100%);}

  /* ---- content ---- */
  .stage{position:relative; z-index:2; width:100%; max-width:560px; text-align:center;}

  .lockup{display:inline-flex; flex-direction:column; align-items:center; gap:16px; margin-bottom:26px;
    opacity:0; animation:rise 1.1s cubic-bezier(.2,.7,.2,1) .05s forwards;}
  .star{width:74px; height:74px; object-fit:contain; display:block;
    filter:drop-shadow(0 8px 26px rgba(226,58,78,.42));
    animation:float 7s ease-in-out 1.2s infinite;}
  .wordmark{font-family:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;
    font-size:15px; font-weight:700; letter-spacing:.42em; text-transform:uppercase;
    padding-left:.42em; color:var(--cream);}
  .wordmark span{color:var(--gold); font-weight:600;}

  .pill{display:inline-flex; align-items:center; gap:9px; margin-bottom:22px;
    font-size:10.5px; font-weight:700; letter-spacing:.22em; text-transform:uppercase;
    color:var(--cream-soft); background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.09); border-radius:999px; padding:7px 15px;
    backdrop-filter:blur(4px);
    opacity:0; animation:rise 1.1s cubic-bezier(.2,.7,.2,1) .28s forwards;}
  .pill .dot{width:7px; height:7px; border-radius:50%; background:var(--brand-red-lit);
    box-shadow:0 0 0 0 rgba(226,58,78,.55); animation:pulse 2.4s ease-out infinite;}

  h1.headline{font-family:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;
    font-weight:700; font-size:clamp(30px, 6.4vw, 46px); line-height:1.05; letter-spacing:-.015em;
    color:var(--cream); margin-bottom:18px;
    opacity:0; animation:rise 1.1s cubic-bezier(.2,.7,.2,1) .42s forwards;}
  h1 .who{color:var(--gold); white-space:nowrap;}

  p.message{font-size:15.5px; line-height:1.75; color:var(--cream-soft); max-width:452px;
    margin:0 auto 34px;
    opacity:0; animation:rise 1.1s cubic-bezier(.2,.7,.2,1) .56s forwards;}

  .signout{font-family:inherit; font-size:12.5px; font-weight:600; letter-spacing:.03em;
    color:var(--muted); background:transparent; border:1px solid rgba(255,255,255,.14);
    border-radius:999px; padding:10px 22px; cursor:pointer; transition:all .2s ease;
    opacity:0; animation:rise 1.1s cubic-bezier(.2,.7,.2,1) .72s forwards;}
  .signout:hover{color:var(--cream); border-color:rgba(255,255,255,.3); background:rgba(255,255,255,.04);}
  .signout:focus-visible{outline:2px solid var(--brand-red-lit); outline-offset:2px;}

  .foot{margin-top:30px; font-size:11px; letter-spacing:.04em; color:rgba(142,138,131,.6);
    opacity:0; animation:rise 1.1s cubic-bezier(.2,.7,.2,1) .86s forwards;}

  /* ---- keyframes (understated, premium) ---- */
  @keyframes rise{from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:none;}}
  @keyframes float{0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,58,78,.5);} 70%{box-shadow:0 0 0 9px rgba(226,58,78,0);} 100%{box-shadow:0 0 0 0 rgba(226,58,78,0);}}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(6vmax,4vmax) scale(1.08);}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-5vmax,-4vmax) scale(1.12);}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-4vmax,5vmax) scale(1.06);}}

  @media (max-width:480px){
    .star{width:62px; height:62px;}
    .wordmark{font-size:13px; letter-spacing:.34em; padding-left:.34em;}
    p.message{font-size:14.5px;}
  }

  /* ---- respect reduced motion: no motion, everything at rest ---- */
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
    .lockup,.pill,h1.headline,p.message,.signout,.foot{opacity:1 !important; transform:none !important;}
    .aurora{opacity:.7;}
  }
</style>
</head>
<body>
  <div class="bg-base"></div>
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="stage">
    <div class="lockup">
      <img class="star" src="/files/static/brand/mark.svg" alt="Superstars Triton">
      <div class="wordmark">Superstars <span>Triton</span></div>
    </div>

    <div class="pill"><span class="dot"></span> Setting up your workspace</div>

    <h1 class="headline">Welcome aboard<span class="who" id="who"></span></h1>

    <p class="message">Your account is all set. Superstars Contracting will connect you to your
      project shortly — everything you need will appear right here the moment it&rsquo;s ready.</p>

    <button type="button" class="signout" id="signout">Sign out</button>

    <div class="foot">Superstars Contracting Inc.</div>
  </main>

<script>
(function(){
  // Greet by first name (the client's own — no other PII). /api/auth/me is client-allowed.
  fetch('/api/auth/me', {credentials:'include'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      var u = j && j.user; if(!u) return;
      var n = (u.display_name || u.full_name || '').trim();
      if(n){ document.getElementById('who').textContent = ', ' + n.split(/\s+/)[0]; }
    }).catch(function(){});

  // The ONLY action on this page.
  document.getElementById('signout').addEventListener('click', function(){
    fetch('/api/auth/logout', {method:'POST', credentials:'include'})
      .catch(function(){})
      .then(function(){ window.location.href = '/login'; });
  });
})();
</script>
<!-- build #267 · 2026-06-30 · Client welcome/pending hard-stop — full server-enforced containment until access is granted -->
</body>
</html>
