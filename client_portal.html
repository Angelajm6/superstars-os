<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Superstars Contracting · Project Portal</title>
<link rel="stylesheet" href="/files/static/fonts/typography.css?v=1014">
<!-- #264 — read-only CLIENT portal. #269 — SECTION-GATED: the page asks /api/portal/context
     which sections this client has been granted (progress / photos / documents / daily /
     schedule, all default OFF) and renders ONLY those. Every section's data endpoint
     re-checks its grant server-side; within Photos/Documents only individually shared
     items are served. NO financials, NO internal nav, NO drop/labor/PII. -->
<style>
  :root{
    --brand-red:#B11E2E;--brand-red-deep:#8B1623;--ink:#14161C;--hairline:#E8E4DD;
    --mute:#76777E;--ok:#2F7C57;--paper:#fff;--canvas:#faf8f5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--canvas);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;}
  .topbar{background:#fff;border-bottom:1px solid var(--hairline);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;}
  .brand{display:flex;align-items:center;gap:11px;min-width:0;}
  .brand svg, .brand img.brand-mark{width:34px;height:34px;flex:none;}  /* #265 — reserved box so a swapped logo can't shift layout */
  .brand-name{font-family:'Inter',-apple-system,sans-serif;font-size:15px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;line-height:1;}
  .brand-sub{font-size:9px;color:var(--mute);letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-top:3px;}
  .chip{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);flex:none;}
  .chip b{color:var(--ink);font-weight:600;}
  .chip button{font:inherit;font-size:11px;font-weight:600;color:var(--mute);background:transparent;border:1px solid var(--hairline);border-radius:6px;padding:5px 10px;cursor:pointer;}
  .chip button:hover{color:var(--brand-red);border-color:var(--brand-red);}
  .wrap{max-width:980px;margin:0 auto;padding:22px 20px 60px;}

  .hero{margin:6px 0 22px;}
  .hero .pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--brand-red);background:#fbeceb;padding:4px 10px;border-radius:99px;margin-bottom:10px;}
  .hero h1{font-family:'Inter',-apple-system,sans-serif;font-size:27px;font-weight:700;line-height:1.15;}
  .hero .addr{color:var(--mute);font-size:14px;margin-top:6px;}
  .status-badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:99px;background:var(--ok);color:#fff;margin-left:8px;vertical-align:middle;}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px;}
  @media (max-width:640px){.cards{grid-template-columns:1fr;}}
  .card{background:#fff;border:1px solid var(--hairline);border-radius:14px;padding:18px 20px;}
  .card .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);}
  .progress-num{font-size:34px;font-weight:600;font-family:'Inter',sans-serif;line-height:1;margin:8px 0 4px;}
  .progress-label{font-size:13px;color:var(--mute);font-weight:600;}
  .bar{height:9px;background:#eee7df;border-radius:99px;overflow:hidden;margin-top:14px;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-red),#d8453f);border-radius:99px;transition:width .5s;}
  .summary-text{font-size:14px;line-height:1.6;color:var(--ink);margin-top:10px;}
  .summary-meta{font-size:12px;color:var(--mute);margin-top:10px;}

  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 14px;}
  .sec-head h2{font-family:'Inter',sans-serif;font-size:18px;font-weight:700;}
  .sec-head .cnt{font-size:12px;color:var(--mute);}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
  .ph{background:#fff;border:1px solid var(--hairline);border-radius:12px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .15s;display:block;}
  .ph:hover{box-shadow:0 6px 18px rgba(177,30,46,.10);transform:translateY(-2px);}
  .ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#efe9e1;}
  .ph .meta{padding:10px 12px;}
  .ph .cap{font-size:13px;font-weight:600;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .ph .date{font-size:11px;color:var(--mute);margin-top:5px;}

  /* #269 — documents / daily / schedule list rows (boxed, calm) */
  .rows{background:#fff;border:1px solid var(--hairline);border-radius:14px;overflow:hidden;}
  .row{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--hairline);}
  .row:last-child{border-bottom:none;}
  .row .r-main{min-width:0;flex:1;}
  .row .r-title{font-size:13.5px;font-weight:600;line-height:1.35;}
  .row .r-sub{font-size:11.5px;color:var(--mute);margin-top:3px;}
  .row .r-tag{flex:none;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);background:#f4f0ea;border-radius:99px;padding:4px 10px;}
  .row .r-tag.work{color:var(--ok);background:#e9f4ee;}
  .row .r-tag.nowork{color:#8a6d3b;background:#f7f0e2;}
  .row a.r-open{flex:none;font-size:12px;font-weight:700;color:var(--brand-red);text-decoration:none;border:1px solid var(--hairline);border-radius:8px;padding:6px 12px;}
  .row a.r-open:hover{border-color:var(--brand-red);}
  .row .r-dates{flex:none;font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap;}

  .empty{border:1px dashed var(--hairline);border-radius:14px;padding:40px 22px;text-align:center;color:var(--mute);font-size:14px;line-height:1.6;background:#fff;}
  .empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px;}
  .foot{text-align:center;color:#b6b0a6;font-size:11px;margin-top:42px;}

  /* #270 — read-only admin preview banner (amber, approved Option B). Rendered ONLY when
     the SERVER says this is a preview (context.preview) — never for a real client. */
  .pv-banner{background:#8a6d3b;color:#fff;padding:10px 16px;font-size:12.5px;font-weight:700;
             display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:60;}
  .pv-banner .eye{font-size:14px;}
  .pv-banner .pv-exit{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.16);
             border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:7px;padding:5px 12px;
             cursor:pointer;text-decoration:none;white-space:nowrap;}
  .pv-banner .pv-exit:hover{background:rgba(255,255,255,.28);}

  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(20,18,16,.86);display:none;align-items:center;justify-content:center;padding:18px;z-index:40;}
  .lb.on{display:flex;}
  .lb img{max-width:100%;max-height:82vh;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.5);}
  .lb .cap{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-size:14px;padding:0 20px;text-shadow:0 1px 4px rgba(0,0,0,.6);}
  .lb .x{position:absolute;top:16px;right:18px;color:#fff;font-size:30px;line-height:1;cursor:pointer;opacity:.85;background:none;border:none;}
  .brand-mark,.mark{object-fit:contain;}  /* #265 swap-safe logo */
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <!-- #265 — canonical filled-star lockup (single source: brand.py) -->
      <img class="brand-mark" src="/files/static/brand/mark.svg" alt="Superstars Contracting">
      <div><div class="brand-name">Superstars Contracting</div><div class="brand-sub">Project Portal</div></div>
    </div>
    <div class="chip"><span id="who">—</span><button id="signout">Sign out</button></div>
  </div>

  <div class="wrap" id="wrap">
    <div class="hero"><div class="pill">Project Portal</div><h1 id="proj-name">Loading…</h1><div class="addr" id="proj-addr"></div></div>
    <div id="content"></div>
    <div class="foot" id="build">build #270 · 2026-07-02 · Client portal — section-gated + per-item visibility; read-only admin preview (server-declared)</div>
  </div>

  <div class="lb" id="lb"><button class="x" id="lb-x" aria-label="Close">×</button><img id="lb-img" alt=""><div class="cap" id="lb-cap"></div></div>

<script>
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmtDate(d){ if(!d) return ''; var p=String(d).slice(0,10).split('-'); return p.length===3 ? p[1]+'/'+p[2]+'/'+p[0] : d; }

  document.getElementById('signout').onclick=function(){ fetch('/api/auth/logout',{method:'POST'}).then(function(){window.location.href='/login';}); };

  // user chip (name only — no role/internal links)
  fetch('/api/auth/me').then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(j&&j.user){ document.getElementById('who').innerHTML='<b>'+esc(j.user.display_name||j.user.full_name||j.user.email)+'</b>'; }
  });

  var LB=document.getElementById('lb');
  function openLB(src,cap){ document.getElementById('lb-img').src=src; document.getElementById('lb-cap').textContent=cap||''; LB.classList.add('on'); }
  document.getElementById('lb-x').onclick=function(){LB.classList.remove('on');document.getElementById('lb-img').src='';};
  LB.onclick=function(e){ if(e.target===LB){LB.classList.remove('on');document.getElementById('lb-img').src='';} };

  function secHead(title, cntId){
    return '<div class="sec-head"><h2>'+esc(title)+'</h2><span class="cnt" id="'+cntId+'"></span></div>';
  }
  function emptyBox(id, strong, text){
    return '<div class="empty" id="'+id+'"><strong>'+esc(strong)+'</strong>'+esc(text)+'</div>';
  }

  // #270 — read-only admin preview: the ?preview_client param rides on EVERY portal
  // fetch (incl. image/file URLs) so the server resolves the same target per request.
  // The SERVER decides whether this is a preview (context.preview) — the param alone
  // never renders a banner, and a real client's requests ignore it server-side.
  var PREVIEW_ID=new URLSearchParams(location.search).get('preview_client');
  function api(u){ if(!PREVIEW_ID) return u; return u+(u.indexOf('?')>=0?'&':'?')+'preview_client='+encodeURIComponent(PREVIEW_ID); }
  function homeAway(){ window.location.href = PREVIEW_ID ? '/admin/projects' : '/welcome'; }
  function showPreviewBanner(name){
    if(document.getElementById('pv-banner')) return;
    var b=document.createElement('div');
    b.className='pv-banner'; b.id='pv-banner';
    b.innerHTML='<span class="eye">👁</span> Viewing as '+esc(name||'client')+' (client) — read-only preview of exactly what they see '
      +'<a class="pv-exit" href="/admin/projects">Exit preview</a>';
    document.body.insertBefore(b, document.body.firstChild);
  }

  // #269 — the context call returns ONLY the sections this client has been granted;
  // the page renders exactly those (server enforces each section's API separately).
  async function load(){
    var content=document.getElementById('content');
    try{
      var r=await fetch(api('/api/portal/context'));
      if(r.status===403){ homeAway(); return; }  // grants revoked mid-session (or preview target contained)
      var cj=await r.json();
      var d=(cj&&cj.data)||{};
      if(!d.project){ homeAway(); return; }
      if(cj&&cj.preview&&cj.preview.on){ showPreviewBanner(cj.preview.client_name); }  // server-declared only
      document.getElementById('proj-name').innerHTML=esc(d.project.name)+(d.project.status==='active'?'<span class="status-badge">Active</span>':'');
      document.getElementById('proj-addr').textContent=d.project.address||'';
      var secs=d.sections||[];
      var html='';
      if(secs.indexOf('progress')>=0){ html+='<div id="sec-progress"></div>'; }
      if(secs.indexOf('photos')>=0){ html+=secHead('Project Photos','ph-cnt')+'<div id="gallery"></div>'; }
      if(secs.indexOf('documents')>=0){ html+=secHead('Shared Documents','doc-cnt')+'<div id="docs"></div>'; }
      if(secs.indexOf('daily')>=0){ html+=secHead('Daily Reports','daily-cnt')+'<div id="daily"></div>'; }
      if(secs.indexOf('schedule')>=0){ html+=secHead('Upcoming Work','sched-cnt')+'<div id="sched"></div>'; }
      content.innerHTML=html;
      var jobs=[];
      if(secs.indexOf('progress')>=0) jobs.push(loadProgress());
      if(secs.indexOf('photos')>=0) jobs.push(loadPhotos());
      if(secs.indexOf('documents')>=0) jobs.push(loadDocuments());
      if(secs.indexOf('daily')>=0) jobs.push(loadDaily());
      if(secs.indexOf('schedule')>=0) jobs.push(loadSchedule());
      await Promise.all(jobs);
    }catch(e){
      content.innerHTML='<div class="empty">We couldn’t load your project right now. Please refresh.</div>';
    }
  }

  // #269 — a 403 on a section fetch means its grant was revoked mid-session. Reload once:
  // the fresh context re-renders ONLY the still-granted sections (or /welcome if none left).
  function revokedMidSession(r){ if(r.status===403){ window.location.reload(); return true; } return false; }

  async function loadProgress(){
    var host=document.getElementById('sec-progress');
    try{
      var r0=await fetch(api('/api/portal/project'));
      if(revokedMidSession(r0)) return;
      var pj=await r0.json();
      var d=(pj&&pj.data)||{};
      var pct=Math.max(0,Math.min(100,(d.progress&&d.progress.pct)||0));
      var summary=(d.summary&&d.summary.text)||'';
      var last=(d.summary&&d.summary.last_activity);
      host.innerHTML=
        '<div class="cards">'
        + '<div class="card"><div class="k">Overall progress</div>'
        + '<div class="progress-num">'+pct+'%</div>'
        + '<div class="progress-label">'+esc((d.progress&&d.progress.label)||'')+'</div>'
        + '<div class="bar"><i style="width:'+pct+'%"></i></div></div>'
        + '<div class="card"><div class="k">Project summary</div>'
        + '<div class="summary-text">'+esc(summary)+'</div>'
        + (last?'<div class="summary-meta">Most recent photo: '+fmtDate(last)+'</div>':'')
        + '</div>'
        + '</div>';
    }catch(e){ host.innerHTML='<div class="empty">Could not load progress.</div>'; }
  }

  async function loadPhotos(){
    var g=document.getElementById('gallery');
    try{
      var r0=await fetch(api('/api/portal/photos'));
      if(revokedMidSession(r0)) return;
      var pr=await r0.json();
      var photos=(pr&&pr.data&&pr.data.photos)||[];
      var cnt=document.getElementById('ph-cnt'); if(cnt) cnt.textContent=photos.length?(photos.length+' shared'):'';
      if(!photos.length){
        g.outerHTML=emptyBox('gallery','No photos shared yet','Photos from your project will appear here as the team shares them with you.');
        return;
      }
      g.className='gallery';
      g.innerHTML=photos.map(function(p){
        return '<a class="ph" data-full="'+esc(api(p.file_url))+'" data-cap="'+esc(p.caption||'')+'">'
          + '<img loading="lazy" src="'+esc(api(p.thumb_url))+'" alt="'+esc(p.caption||'Project photo')+'">'
          + '<div class="meta"><div class="cap">'+esc(p.caption||'Project photo')+'</div>'
          + '<div class="date">'+fmtDate(p.taken_at)+'</div></div></a>';
      }).join('');
      Array.prototype.forEach.call(g.querySelectorAll('.ph'),function(a){
        a.onclick=function(){ openLB(a.getAttribute('data-full'), a.getAttribute('data-cap')); };
      });
    }catch(e){ g.innerHTML='<div class="empty">Could not load photos.</div>'; }
  }

  // #269 — documents: only the individually shared documents ever arrive here.
  async function loadDocuments(){
    var host=document.getElementById('docs');
    try{
      var r0=await fetch(api('/api/portal/documents'));
      if(revokedMidSession(r0)) return;
      var dr=await r0.json();
      var docs=(dr&&dr.data&&dr.data.documents)||[];
      var cnt=document.getElementById('doc-cnt'); if(cnt) cnt.textContent=docs.length?(docs.length+' shared'):'';
      if(!docs.length){
        host.outerHTML=emptyBox('docs','No documents shared yet','Project documents will appear here as the team shares them with you.');
        return;
      }
      host.className='rows';
      host.innerHTML=docs.map(function(d){
        return '<div class="row"><div class="r-main">'
          + '<div class="r-title">'+esc(d.title||'Document')+'</div>'
          + '<div class="r-sub">'+esc(d.category||'')+(d.effective_date?(' · '+fmtDate(d.effective_date)):'')+'</div></div>'
          + (d.doc_type?'<span class="r-tag">'+esc(d.doc_type)+'</span>':'')
          + '<a class="r-open" href="'+esc(api(d.file_url))+'" target="_blank" rel="noopener">Open</a>'
          + '</div>';
      }).join('');
    }catch(e){ host.innerHTML='<div class="empty">Could not load documents.</div>'; }
  }

  // #269 — daily: curated date + work/no-work timeline.
  async function loadDaily(){
    var host=document.getElementById('daily');
    try{
      var r0=await fetch(api('/api/portal/daily'));
      if(revokedMidSession(r0)) return;
      var dr=await r0.json();
      var days=(dr&&dr.data&&dr.data.days)||[];
      var cnt=document.getElementById('daily-cnt'); if(cnt) cnt.textContent=days.length?(days.length+' report day'+(days.length===1?'':'s')):'';
      if(!days.length){
        host.outerHTML=emptyBox('daily','No daily reports yet','A day-by-day record of site activity will appear here as reports are issued.');
        return;
      }
      host.className='rows';
      host.innerHTML=days.map(function(d){
        return '<div class="row"><div class="r-main">'
          + '<div class="r-title">'+fmtDate(d.date)+'</div></div>'
          + '<span class="r-tag '+(d.no_work?'nowork':'work')+'">'+esc(d.label||'')+'</span>'
          + '</div>';
      }).join('');
    }catch(e){ host.innerHTML='<div class="empty">Could not load daily reports.</div>'; }
  }

  // #269 — schedule: curated look-ahead window (name/type + planned dates only).
  async function loadSchedule(){
    var host=document.getElementById('sched');
    try{
      var r0=await fetch(api('/api/portal/schedule'));
      if(revokedMidSession(r0)) return;
      var sr=await r0.json();
      var acts=(sr&&sr.data&&sr.data.activities)||[];
      var cnt=document.getElementById('sched-cnt'); if(cnt) cnt.textContent=acts.length?(acts.length+' planned'):'';
      if(!acts.length){
        host.outerHTML=emptyBox('sched','Nothing scheduled in this window','Upcoming planned work will appear here as the schedule fills in.');
        return;
      }
      host.className='rows';
      host.innerHTML=acts.map(function(a){
        var range=fmtDate(a.start)+(a.finish&&a.finish!==a.start?(' – '+fmtDate(a.finish)):'');
        return '<div class="row"><div class="r-main">'
          + '<div class="r-title">'+esc(a.name||'Activity')+'</div>'
          + '<div class="r-sub">'+esc(a.type||'')+'</div></div>'
          + '<span class="r-dates">'+range+'</span>'
          + '</div>';
      }).join('');
    }catch(e){ host.innerHTML='<div class="empty">Could not load the schedule.</div>'; }
  }

  load();
</script>
</body>
</html>
